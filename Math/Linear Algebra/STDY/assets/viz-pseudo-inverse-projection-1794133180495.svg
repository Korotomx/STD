<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <rect width="1200" height="680" fill="#0B0B0F"/>

  <defs>
    <marker id="arrCyan" viewBox="0 0 11 11" refX="9" refY="5.5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#22D3EE"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 11 11" refX="9" refY="5.5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#E5E7EB"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 11 11" refX="9" refY="5.5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <!-- ================= LEFT PANEL ================= -->
  <text x="40" y="74" fill="#E5E7EB" font-size="26" font-weight="600">A：把平面压成一条线</text>
  <text x="40" y="106" fill="#9CA3AF" font-size="17">σ₁ = 2 的方向保留，σ₂ = 0 的方向被压没</text>

  <g>
    <!-- axes -->
    <line x1="185" y1="325" x2="445" y2="325" stroke="#2E2E2E" stroke-width="1.2"/>
    <line x1="290" y1="195" x2="290" y2="455" stroke="#2E2E2E" stroke-width="1.2"/>

    <!-- y = x guide -->
    <line x1="154" y1="461" x2="426" y2="189" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="6 6"/>

    <!-- unit circle (input space) -->
    <circle cx="290" cy="325" r="80" fill="none" stroke="#22D3EE" stroke-width="1.6"/>

    <!-- image of the circle: segment from (-sqrt2,-sqrt2) to (sqrt2,sqrt2) -->
    <line x1="177" y1="438" x2="403" y2="212" stroke="#A78BFA" stroke-width="3.6" stroke-linecap="round"/>

    <!-- v1 input arrow -->
    <line x1="290" y1="325" x2="347" y2="268" stroke="#22D3EE" stroke-width="1.8" marker-end="url(#arrCyan)"/>
    <!-- v2 input arrow (gets mapped to 0) -->
    <line x1="290" y1="325" x2="347" y2="382" stroke="#22D3EE" stroke-width="1.8" marker-end="url(#arrCyan)"/>

    <!-- stretch v1 -> 2u1, overflowing the circle -->
    <line x1="347" y1="268" x2="401" y2="214" stroke="#E5E7EB" stroke-width="1.7" marker-end="url(#arrInk)"/>

    <!-- origin -->
    <circle cx="290" cy="325" r="3.2" fill="#E5E7EB"/>
  </g>

  <text x="318" y="238" fill="#22D3EE" font-size="18" text-anchor="middle">v₁</text>
  <text x="357" y="214" fill="#9CA3AF" font-size="17" text-anchor="middle">σ₁ = 2</text>
  <text x="395" y="185" font-size="18" text-anchor="end"><tspan fill="#A78BFA">2u₁</tspan><tspan fill="#E5E7EB"> = (√2, √2)</tspan></text>
  <text x="415" y="240" fill="#A78BFA" font-size="18">列空间 C(A)</text>
  <text x="367" y="406" font-size="18"><tspan fill="#22D3EE">v₂</tspan><tspan fill="#6B7280">&#160;&#8594;&#160;0</tspan></text>

  <!-- ================= RIGHT PANEL ================= -->
  <text x="610" y="74" fill="#E5E7EB" font-size="26" font-weight="600">A⁺：先投影，再按 1/σ 缩回去</text>
  <text x="610" y="106" fill="#9CA3AF" font-size="17">零方向没有信息可还原，只能输出 0</text>

  <g>
    <!-- axes -->
    <line x1="680" y1="320" x2="1140" y2="320" stroke="#2E2E2E" stroke-width="1.2"/>
    <line x1="850" y1="170" x2="850" y2="470" stroke="#2E2E2E" stroke-width="1.2"/>

    <!-- y = x : column space -->
    <line x1="722" y1="448" x2="990" y2="180" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="7 6"/>

    <!-- null space direction (1,-1) -->
    <line x1="754" y1="224" x2="946" y2="416" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="5 6"/>

    <!-- perpendicular b -> p -->
    <line x1="1042" y1="272" x2="970" y2="200" stroke="#9CA3AF" stroke-width="1.6"/>

    <!-- right angle at p -->
    <path d="M978.5,208.5 L970,217 L961.5,208.5" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>

    <!-- projection arrow p -> x+ (towards origin along the line) -->
    <line x1="970" y1="200" x2="912" y2="258" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrPurple)"/>

    <!-- points -->
    <circle cx="1042" cy="272" r="5" fill="#E5E7EB"/>
    <circle cx="970" cy="200" r="5" fill="#A78BFA"/>
    <circle cx="910" cy="260" r="4.5" fill="#A78BFA"/>
  </g>

  <text x="950" y="170" fill="#9CA3AF" font-size="16" text-anchor="end">投影 AA⁺b</text>
  <text x="950" y="192" fill="#E5E7EB" font-size="17" text-anchor="end">p = (1.5, 1.5)</text>
  <text x="1052" y="254" fill="#E5E7EB" font-size="18">b = (2.4, 0.6)</text>
  <text x="933" y="304" font-size="16" xml:space="preserve"><tspan fill="#A78BFA">A⁺b = (1/2)·p</tspan><tspan fill="#9CA3AF" xml:space="preserve"> = (0.75, 0.75)</tspan></text>
  <text x="770" y="432" fill="#A78BFA" font-size="18">列空间 C(A)</text>
  <text x="965" y="412" fill="#6B7280" font-size="16">零空间：A⁺ 输出 0</text>
  <text x="890" y="248" fill="#A78BFA" font-size="18" text-anchor="end">x⁺</text>

  <!-- ================= BOTTOM BAND ================= -->
  <g>
    <rect x="40" y="556" width="300" height="78" rx="12" fill="#14141B" stroke="#2E2E2E" stroke-width="1.2"/>
    <rect x="360" y="556" width="260" height="78" rx="12" fill="#14141B" stroke="#2E2E2E" stroke-width="1.2"/>
    <rect x="640" y="556" width="520" height="78" rx="12" fill="#14141B" stroke="#2E2E2E" stroke-width="1.2"/>
  </g>
  <text x="190" y="604" fill="#E5E7EB" font-size="22" text-anchor="middle">σᵢ ≠ 0 <tspan fill="#6B7280">&#8594;</tspan> <tspan fill="#A78BFA">1/σᵢ</tspan></text>
  <text x="490" y="604" fill="#E5E7EB" font-size="22" text-anchor="middle">σᵢ = 0 <tspan fill="#6B7280">&#8594;</tspan> <tspan fill="#9CA3AF">0</tspan></text>
  <text x="900" y="604" fill="#E5E7EB" font-size="22" text-anchor="middle">b 在线外 <tspan fill="#6B7280">&#8594;</tspan> <tspan fill="#A78BFA">先投影</tspan>，就是最小二乘</text>
</svg>
