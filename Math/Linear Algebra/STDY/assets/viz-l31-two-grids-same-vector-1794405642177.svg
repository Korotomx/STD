<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif">
  <rect width="1000" height="460" fill="#0B0B0F"/>

  <defs>
    <marker id="pArrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
    <marker id="gArrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8.5" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9CA3AF"/>
    </marker>
    <clipPath id="clipL"><rect x="25" y="60" width="450" height="348"/></clipPath>
    <clipPath id="clipR"><rect x="525" y="60" width="450" height="348"/></clipPath>
  </defs>

  <!-- left grid: standard unit grid -->
  <g clip-path="url(#clipL)" stroke="#2A2A3A" stroke-width="1">
    <line x1="30" y1="60" x2="30" y2="408"/>
    <line x1="70" y1="60" x2="70" y2="408"/>
    <line x1="110" y1="60" x2="110" y2="408"/>
    <line x1="150" y1="60" x2="150" y2="408"/>
    <line x1="190" y1="60" x2="190" y2="408"/>
    <line x1="230" y1="60" x2="230" y2="408"/>
    <line x1="270" y1="60" x2="270" y2="408"/>
    <line x1="310" y1="60" x2="310" y2="408"/>
    <line x1="350" y1="60" x2="350" y2="408"/>
    <line x1="390" y1="60" x2="390" y2="408"/>
    <line x1="430" y1="60" x2="430" y2="408"/>
    <line x1="470" y1="60" x2="470" y2="408"/>
    <line x1="25" y1="70" x2="475" y2="70"/>
    <line x1="25" y1="110" x2="475" y2="110"/>
    <line x1="25" y1="150" x2="475" y2="150"/>
    <line x1="25" y1="190" x2="475" y2="190"/>
    <line x1="25" y1="230" x2="475" y2="230"/>
    <line x1="25" y1="270" x2="475" y2="270"/>
    <line x1="25" y1="310" x2="475" y2="310"/>
    <line x1="25" y1="350" x2="475" y2="350"/>
    <line x1="25" y1="390" x2="475" y2="390"/>
  </g>

  <!-- right grid: sheared by b1=(2,1), b2=(-1,1) -->
  <g clip-path="url(#clipR)" stroke="#2A2A3A" stroke-width="1">
    <line x1="1050" y1="870" x2="90" y2="-90"/>
    <line x1="1130" y1="830" x2="170" y2="-130"/>
    <line x1="1210" y1="790" x2="250" y2="-170"/>
    <line x1="1290" y1="750" x2="330" y2="-210"/>
    <line x1="1370" y1="710" x2="410" y2="-250"/>
    <line x1="1450" y1="670" x2="490" y2="-290"/>
    <line x1="1530" y1="630" x2="570" y2="-330"/>
    <line x1="-190" y1="950" x2="1730" y2="-10"/>
    <line x1="-230" y1="910" x2="1690" y2="-50"/>
    <line x1="-270" y1="870" x2="1650" y2="-90"/>
    <line x1="-310" y1="830" x2="1610" y2="-130"/>
    <line x1="-350" y1="790" x2="1570" y2="-170"/>
    <line x1="-390" y1="750" x2="1530" y2="-210"/>
    <line x1="-430" y1="710" x2="1490" y2="-250"/>
    <line x1="-470" y1="670" x2="1450" y2="-290"/>
    <line x1="-510" y1="630" x2="1410" y2="-330"/>
  </g>

  <!-- divider -->
  <line x1="500" y1="56" x2="500" y2="414" stroke="#2A2A3A" stroke-width="1"/>

  <!-- left axes -->
  <line x1="32" y1="350" x2="455" y2="350" stroke="#9CA3AF" stroke-width="2" marker-end="url(#gArrow)"/>
  <line x1="150" y1="402" x2="150" y2="80" stroke="#9CA3AF" stroke-width="2" marker-end="url(#gArrow)"/>
  <circle cx="150" cy="350" r="3.5" fill="#E5E7EB"/>

  <!-- left: dashed components of x = 3e1 + 2e2 -->
  <line x1="150" y1="350" x2="270" y2="350" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/>
  <line x1="270" y1="350" x2="270" y2="270" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/>

  <!-- right: dashed parallelogram, x = (5/3)b1 + (1/3)b2 -->
  <line x1="650" y1="350" x2="783.33" y2="283.33" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/>
  <line x1="783.33" y1="283.33" x2="770" y2="270" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/>
  <line x1="650" y1="350" x2="636.67" y2="336.67" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/>
  <line x1="636.67" y1="336.67" x2="770" y2="270" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/>

  <!-- left vector x -->
  <line x1="150" y1="350" x2="270" y2="270" stroke="#A78BFA" stroke-width="3.5" marker-end="url(#pArrow)"/>
  <circle cx="270" cy="270" r="5" fill="#A78BFA"/>

  <!-- right basis vectors and same vector x -->
  <line x1="650" y1="350" x2="730" y2="310" stroke="#A78BFA" stroke-width="3" marker-end="url(#pArrow)"/>
  <line x1="650" y1="350" x2="610" y2="310" stroke="#A78BFA" stroke-width="3" marker-end="url(#pArrow)"/>
  <circle cx="650" cy="350" r="3.5" fill="#E5E7EB"/>
  <line x1="650" y1="350" x2="770" y2="270" stroke="#A78BFA" stroke-width="3.5" marker-end="url(#pArrow)"/>
  <circle cx="770" cy="270" r="5" fill="#A78BFA"/>

  <!-- titles -->
  <text x="250" y="41" text-anchor="middle" font-size="20" font-weight="600" fill="#E5E7EB">标准基：e₁ = (1, 0)，e₂ = (0, 1)</text>
  <text x="750" y="41" text-anchor="middle" font-size="20" font-weight="600" fill="#E5E7EB">Jennifer 的基：b₁ = (2, 1)，b₂ = (−1, 1)</text>

  <!-- left labels -->
  <text x="441" y="338" font-size="18" fill="#9CA3AF">e₁</text>
  <text x="160" y="90" font-size="18" fill="#9CA3AF">e₂</text>
  <text x="210" y="372" text-anchor="middle" font-size="17" fill="#9CA3AF">3</text>
  <text x="283" y="315" font-size="17" fill="#9CA3AF">2</text>
  <text x="283" y="254" font-size="20" font-weight="600" fill="#A78BFA">x = (3, 2)</text>

  <!-- right labels -->
  <text x="740" y="320" font-size="18" fill="#A78BFA">b₁</text>
  <text x="604" y="302" text-anchor="end" font-size="18" fill="#A78BFA">b₂</text>
  <text x="688" y="286" text-anchor="middle" font-size="16" fill="#9CA3AF">5/3 b₁</text>
  <text x="798" y="280" font-size="16" fill="#9CA3AF">1/3 b₂</text>
  <text x="783" y="254" font-size="20" font-weight="600" fill="#A78BFA">x = (5/3, 1/3)</text>

  <!-- bottom caption and dictionary -->
  <text x="500" y="425" text-anchor="middle" font-size="16" fill="#9CA3AF">同一个平面、同一个向量 x —— 只是换了一套坐标网格</text>
  <text x="500" y="448" text-anchor="middle" font-size="17" fill="#9CA3AF"><tspan fill="#A78BFA">W = [b₁ b₂]</tspan>：Jennifer 坐标 → 标准坐标　　<tspan fill="#A78BFA">W⁻¹</tspan>：标准坐标 → Jennifer 坐标</text>
</svg>
