<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <rect width="1100" height="680" fill="#131312"/>

  <defs>
    <marker id="arrowP" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#7DD3FC"/>
    </marker>
  </defs>

  <!-- panel frames: two DIFFERENT planes -->
  <rect x="48" y="64" width="476" height="356" rx="10" fill="none" stroke="#2E2E2E" stroke-width="1.5"/>
  <rect x="576" y="64" width="476" height="356" rx="10" fill="none" stroke="#2E2E2E" stroke-width="1.5"/>

  <!-- LEFT: right eigenvectors of A -->
  <text x="72" y="102" font-size="22" font-weight="700" fill="#A78BFA">右特征向量 x</text>
  <text x="72" y="132" font-size="18" fill="#9CA3AF">A x = λ x ，A = [[2, 1], [0, 3]]</text>

  <line x1="96" y1="330" x2="466" y2="330" stroke="#3F3F3F" stroke-width="1.5"/>
  <line x1="200" y1="160" x2="200" y2="404" stroke="#3F3F3F" stroke-width="1.5"/>
  <circle cx="200" cy="330" r="3.5" fill="#6B7280"/>

  <line x1="200" y1="330" x2="280" y2="330" stroke="#A78BFA" stroke-width="3" marker-end="url(#arrowP)"/>
  <line x1="200" y1="330" x2="280" y2="250" stroke="#A78BFA" stroke-width="3" marker-end="url(#arrowP)"/>

  <text x="240" y="362" text-anchor="middle" font-size="19" fill="#A78BFA">x₁ = (1, 0),  λ = 2</text>
  <text x="294" y="246" font-size="19" fill="#A78BFA">x₂ = (1, 1),  λ = 3</text>

  <!-- RIGHT: left eigenvectors of A^T -->
  <text x="600" y="102" font-size="22" font-weight="700" fill="#7DD3FC">左特征向量 y</text>
  <text x="600" y="132" font-size="18" fill="#9CA3AF">Aᵀ y = λ y ，Aᵀ = [[2, 0], [1, 3]]</text>

  <line x1="624" y1="330" x2="994" y2="330" stroke="#3F3F3F" stroke-width="1.5"/>
  <line x1="720" y1="160" x2="720" y2="404" stroke="#3F3F3F" stroke-width="1.5"/>
  <circle cx="720" cy="330" r="3.5" fill="#6B7280"/>

  <line x1="720" y1="330" x2="800" y2="410" stroke="#7DD3FC" stroke-width="3" marker-end="url(#arrowB)"/>
  <line x1="720" y1="330" x2="720" y2="250" stroke="#7DD3FC" stroke-width="3" marker-end="url(#arrowB)"/>

  <text x="812" y="400" font-size="19" fill="#7DD3FC">y₁ = (1, −1),  λ = 2</text>
  <text x="734" y="246" font-size="19" fill="#7DD3FC">y₂ = (0, 1),  λ = 3</text>

  <!-- BOTTOM: biorthogonality table -->
  <text x="550" y="452" text-anchor="middle" font-size="20" fill="#E5E7EB">双正交：yᵢᵀ xⱼ = δᵢⱼ</text>

  <g stroke="#3A3A3A" stroke-width="1.5">
    <line x1="360" y1="468" x2="740" y2="468"/>
    <line x1="360" y1="510" x2="740" y2="510"/>
    <line x1="360" y1="558" x2="740" y2="558"/>
    <line x1="360" y1="606" x2="740" y2="606"/>
    <line x1="360" y1="468" x2="360" y2="606"/>
    <line x1="460" y1="468" x2="460" y2="606"/>
    <line x1="600" y1="468" x2="600" y2="606"/>
    <line x1="740" y1="468" x2="740" y2="606"/>
  </g>

  <text x="410" y="496" text-anchor="middle" font-size="14" fill="#6B7280">yᵀ \ x</text>
  <text x="530" y="496" text-anchor="middle" font-size="20" fill="#A78BFA">x₁</text>
  <text x="670" y="496" text-anchor="middle" font-size="20" fill="#A78BFA">x₂</text>

  <text x="410" y="542" text-anchor="middle" font-size="20" fill="#7DD3FC">y₁ᵀ</text>
  <text x="410" y="590" text-anchor="middle" font-size="20" fill="#7DD3FC">y₂ᵀ</text>

  <text x="530" y="544" text-anchor="middle" font-size="27" font-weight="700" fill="#E5E7EB">1</text>
  <text x="670" y="544" text-anchor="middle" font-size="27" font-weight="700" fill="#6B7280">0</text>
  <text x="530" y="592" text-anchor="middle" font-size="27" font-weight="700" fill="#6B7280">0</text>
  <text x="670" y="592" text-anchor="middle" font-size="27" font-weight="700" fill="#E5E7EB">1</text>

  <!-- caption -->
  <text x="550" y="650" text-anchor="middle" font-size="18" fill="#9CA3AF">A 与 Aᵀ 特征值相同；右特征向量是列，左特征向量是行；一般不相同。</text>
</svg>
