  <path d="M386 502 L404 520 M386 520 L404 502" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <path d="M561 502 L579 520 M561 520 L579 502" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <path d="M736 502 L754 520 M736 520 L754 502" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <text x="1085" y="520" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#E5484D">否</text>
  <text x="1330" y="520" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#E5484D">否</text>

  <!-- Row d=6 -->
  <text x="155" y="577" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="32" font-weight="bold" fill="#E5E7EB">6</text>
  <path d="M384 567 L392 575 L406 556" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M561 558 L579 576 M561 576 L579 558" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <path d="M736 558 L754 576 M736 576 L754 558" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <text x="1085" y="576" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#E5484D">否</text>
  <text x="1330" y="576" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#E5484D">否</text>

  <!-- Row d=8 -->
  <text x="155" y="633" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="32" font-weight="bold" fill="#E5E7EB">8</text>
  <path d="M386 614 L404 632 M386 632 L404 614" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <path d="M559 623 L567 631 L581 612" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M734 623 L742 631 L756 612" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1085" y="632" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#E5484D">否</text>
  <text x="1330" y="632" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#E5484D">否</text>

  <!-- Row d=12 -->
  <text x="155" y="689" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="32" font-weight="bold" fill="#E5E7EB">12</text>
  <path d="M384 679 L392 687 L406 668" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M561 670 L579 688 M561 688 L579 670" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <path d="M736 670 L754 688 M736 688 L754 670" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <text x="1085" y="688" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#E5484D">否</text>
  <text x="1330" y="688" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#E5484D">否</text>

  <!-- Bottom separator -->
  <line x1="90" y1="730" x2="1510" y2="730" stroke="#2E2E2E" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Conclusion -->
  <text x="800" y="796" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" fill="#E5E7EB">每一行两边结论都一致 → 两个交集逐个相同，最大者自然相同 <tspan fill="#A78BFA" font-weight="bold">= 4</tspan></text>
</svg>
