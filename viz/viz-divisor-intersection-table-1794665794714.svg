<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#131312"/>

  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="46" font-weight="bold" fill="#E5E7EB">逐个整数核对：两个交集完全相同</text>
  <text x="800" y="96" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="27" fill="#9CA3AF">12 = 1×8 + 4　·　逐行比对 d 对 12、8、4 的整除情况</text>

  <!-- Panel -->
  <rect x="60" y="130" width="1480" height="720" rx="18" fill="#131312" stroke="#A78BFA" stroke-width="2.5"/>

  <!-- Group brackets above header -->
  <path d="M323 204 V216 H638 V204" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="311" y="216" text-anchor="end" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="bold" fill="#A78BFA">(12,8)</text>

  <path d="M498 170 V182 H813 V170" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="825" y="182" text-anchor="start" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="26" font-weight="bold" fill="#F59E0B">(8,4)</text>

  <!-- Header band -->
  <rect x="76" y="218" width="1448" height="40" rx="8" fill="#1E1E2E"/>

  <!-- Header text -->
  <text x="155" y="246" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="28" font-weight="bold" fill="#9CA3AF">d</text>
  <text x="395" y="246" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="28" fill="#E5E7EB">整除 12？</text>
  <text x="570" y="246" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="28" fill="#E5E7EB">整除 8？</text>
  <text x="745" y="246" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="28" fill="#E5E7EB">整除 4？</text>
  <text x="1085" y="246" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="27" fill="#A78BFA">(12,8) 都对？</text>
  <text x="1330" y="246" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="27" fill="#F59E0B">(8,4) 都对？</text>

  <!-- Header underline -->
  <line x1="76" y1="258" x2="1524" y2="258" stroke="#A78BFA" stroke-width="2"/>

  <!-- Zebra row bands -->
  <rect x="76" y="258" width="1448" height="56" rx="8" fill="#1E1E2E"/>
  <rect x="76" y="370" width="1448" height="56" rx="8" fill="#1E1E2E"/>
  <rect x="76" y="482" width="1448" height="56" rx="8" fill="#1E1E2E"/>
  <rect x="76" y="594" width="1448" height="56" rx="8" fill="#1E1E2E"/>

  <!-- Column divider between divisibility and conclusions -->
  <line x1="920" y1="258" x2="920" y2="706" stroke="#2E2E2E" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Row d=1 -->
  <text x="155" y="297" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="32" font-weight="bold" fill="#E5E7EB">1</text>
  <path d="M384 287 L392 295 L406 276" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
