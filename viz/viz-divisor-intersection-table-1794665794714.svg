  <path d="M734 287 L742 295 L756 276" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1085" y="296" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#34D399">是</text>
  <text x="1330" y="296" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#34D399">是</text>

  <!-- Row d=2 -->
  <text x="155" y="353" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="32" font-weight="bold" fill="#E5E7EB">2</text>
  <path d="M384 343 L392 351 L406 332" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M559 343 L567 351 L581 332" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M734 343 L742 351 L756 332" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1085" y="352" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#34D399">是</text>
  <text x="1330" y="352" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#34D399">是</text>

  <!-- Row d=3 -->
  <text x="155" y="409" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="32" font-weight="bold" fill="#E5E7EB">3</text>
  <path d="M384 399 L392 407 L406 388" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M561 390 L579 408 M561 408 L579 390" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <path d="M736 390 L754 408 M736 408 L754 390" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <text x="1085" y="408" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#E5484D">否</text>
  <text x="1330" y="408" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#E5484D">否</text>

  <!-- Row d=4 -->
  <text x="155" y="465" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="32" font-weight="bold" fill="#E5E7EB">4</text>
  <path d="M384 455 L392 463 L406 444" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M559 455 L567 463 L581 444" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M734 455 L742 463 L756 444" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1085" y="464" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#34D399">是</text>
  <text x="1330" y="464" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" fill="#34D399">是</text>

  <!-- Row d=5 -->
