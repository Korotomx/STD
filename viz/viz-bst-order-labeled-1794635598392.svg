<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <rect width="1000" height="760" fill="#131312"/>

  <!-- subtree regions -->
  <g fill="#A78BFA" fill-opacity="0.06" stroke="#A78BFA" stroke-opacity="0.4"
     stroke-width="1.5" stroke-dasharray="7 7">
    <rect x="115" y="310" width="370" height="290" rx="18"/>
    <rect x="630" y="310" width="255" height="290" rx="18"/>
  </g>

  <!-- edges -->
  <g stroke="#9CA3AF" stroke-width="2.5" fill="none">
    <line x1="500" y1="200" x2="300" y2="370"/>
    <line x1="500" y1="200" x2="700" y2="370"/>
    <line x1="300" y1="370" x2="185" y2="540"/>
    <line x1="300" y1="370" x2="415" y2="540"/>
    <line x1="700" y1="370" x2="815" y2="540"/>
  </g>

  <!-- edge direction labels -->
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22"
     text-anchor="middle" dominant-baseline="central" fill="#E5E7EB">
    <text x="371" y="248">小</text>
    <text x="629" y="248">大</text>
    <text x="220" y="441">小</text>
    <text x="380" y="441">大</text>
    <text x="780" y="441">大</text>
  </g>

  <!-- group labels -->
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20"
     text-anchor="middle" dominant-baseline="central" fill="#9CA3AF">
    <text x="300" y="286">左子树 {1, 3, 6}</text>
    <text x="757" y="286">右子树 {10, 14}</text>
    <text x="500" y="128">根</text>
  </g>

  <!-- nodes -->
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="32" font-weight="500"
     text-anchor="middle" dominant-baseline="central" fill="#E5E7EB">
    <circle cx="500" cy="200" r="44" fill="#1E1E2E" stroke="#A78BFA" stroke-width="5"/>
    <text x="500" y="200">8</text>

    <circle cx="300" cy="370" r="40" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="300" y="370">3</text>

    <circle cx="700" cy="370" r="40" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="700" y="370">10</text>

    <circle cx="185" cy="540" r="40" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="185" y="540">1</text>

    <circle cx="415" cy="540" r="40" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="415" y="540">6</text>

    <circle cx="815" cy="540" r="40" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="815" y="540">14</text>
  </g>

  <!-- bottom invariant -->
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30"
     dominant-baseline="central">
    <text x="430" y="680" fill="#9CA3AF" text-anchor="end">左子树</text>
    <text x="500" y="680" fill="#A78BFA" text-anchor="middle">＜ 根 ＜</text>
    <text x="570" y="680" fill="#9CA3AF" text-anchor="start">右子树</text>
  </g>
</svg>
