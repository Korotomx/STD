<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" xml:space="preserve">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
    </marker>
    <clipPath id="rclip">
      <rect x="637" y="100" width="375" height="486"/>
    </clipPath>
  </defs>

  <rect width="1200" height="650" fill="#131312"/>

  <!-- divider -->
  <line x1="634" y1="40" x2="634" y2="600" stroke="#2E2E2E" stroke-width="1" stroke-dasharray="4 10"/>

  <!-- ================= LEFT PANEL ================= -->
  <text x="64" y="58" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">向量 v：逆变分量（上指标）</text>

  <!-- faint axes -->
  <line x1="120" y1="500" x2="600" y2="500" stroke="#2E2E2E" stroke-width="1"/>
  <line x1="170" y1="270" x2="170" y2="595" stroke="#2E2E2E" stroke-width="1"/>

  <!-- formula block -->
  <text x="200" y="150" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">v = 2e<tspan dy="6" font-size="15">1</tspan><tspan dy="-6"> + 1e</tspan><tspan dy="6" font-size="15">2</tspan></text>
  <text x="200" y="192" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#A78BFA">v<tspan dy="-8" font-size="15">i</tspan><tspan dy="8"> = (2, 1)</tspan></text>

  <!-- parallelogram -->
  <polygon points="170,500 410,500 530,380 290,380" fill="#A78BFA" fill-opacity="0.06" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- basis arrows -->
  <line x1="170" y1="500" x2="290" y2="500" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="170" y1="500" x2="290" y2="380" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- v -->
  <line x1="170" y1="500" x2="530" y2="380" stroke="#A78BFA" stroke-width="3" marker-end="url(#ap)"/>

  <!-- labels -->
  <text x="302" y="486" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" fill="#9CA3AF">e<tspan dy="6" font-size="14">1</tspan></text>
  <text x="304" y="358" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" fill="#9CA3AF">e<tspan dy="6" font-size="14">2</tspan></text>
  <text x="542" y="370" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" fill="#A78BFA">v</text>
  <text x="362" y="530" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" fill="#9CA3AF">2e<tspan dy="6" font-size="13">1</tspan></text>
  <text x="218" y="430" text-anchor="end" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" fill="#9CA3AF">1e<tspan dy="6" font-size="13">2</tspan></text>

  <!-- ================= RIGHT PANEL ================= -->
  <text x="664" y="58" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">余向量 f：协变分量（下指标）</text>

  <!-- faint axes -->
  <line x1="660" y1="340" x2="1160" y2="340" stroke="#2E2E2E" stroke-width="1"/>
  <line x1="720" y1="110" x2="720" y2="595" stroke="#2E2E2E" stroke-width="1"/>

  <!-- level lines 3x - y = c -->
  <g clip-path="url(#rclip)" stroke="#2E2E2E" stroke-width="1.5" stroke-dasharray="7 7">
    <line x1="580" y1="760" x2="1035" y2="-605"/>
    <line x1="580" y1="900" x2="1035" y2="-465"/>
    <line x1="580" y1="1040" x2="1035" y2="-325"/>
    <line x1="580" y1="1180" x2="1035" y2="-185"/>
  </g>
  <g clip-path="url(#rclip)">
    <line x1="580" y1="1320" x2="1035" y2="-45" stroke="#A78BFA" stroke-width="2.5"/>
  </g>

  <!-- parallelogram -->
  <polygon points="720,340 930,550 930,410 720,200" fill="#A78BFA" fill-opacity="0.06" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- dual basis arrows -->
  <line x1="720" y1="340" x2="790" y2="410" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="720" y1="340" x2="720" y2="270" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- f -->
  <line x1="720" y1="340" x2="930" y2="410" stroke="#A78BFA" stroke-width="3" marker-end="url(#ap)"/>

  <!-- v point on the level line -->
  <circle cx="930" cy="270" r="6" fill="#A78BFA"/>

  <!-- labels -->
  <text x="798" y="392" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" fill="#9CA3AF">e<tspan dy="-8" font-size="14">1</tspan></text>
  <text x="734" y="264" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" fill="#9CA3AF">e<tspan dy="-8" font-size="14">2</tspan></text>
  <text x="944" y="404" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" fill="#A78BFA">f</text>
  <text x="792" y="482" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" fill="#9CA3AF">3e<tspan dy="-7" font-size="13">1</tspan></text>
  <text x="706" y="222" text-anchor="end" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" fill="#9CA3AF">2e<tspan dy="-7" font-size="13">2</tspan></text>
  <text x="908" y="264" text-anchor="end" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" fill="#A78BFA">v</text>
  <text x="975" y="164" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" fill="#A78BFA">f = 8</text>

  <!-- right text block -->
  <text x="968" y="440" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" fill="#E5E7EB">f = 3e<tspan dy="-8" font-size="14">1</tspan><tspan dy="8"> + 2e</tspan><tspan dy="-8" font-size="14">2</tspan></text>
  <text x="968" y="476" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" fill="#A78BFA">f<tspan dy="6" font-size="14">i</tspan><tspan dy="-6"> = (3, 2)</tspan></text>
  <text x="968" y="512" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" fill="#E5E7EB">f(v) = 3·2 + 2·1 = 8</text>

  <!-- caption -->
  <text x="600" y="620" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" fill="#9CA3AF">上指标 v<tspan dy="-7" font-size="14">i</tspan><tspan dy="7"> 逆变，下指标 f</tspan><tspan dy="6" font-size="14">i</tspan><tspan dy="-6"> 协变；配对 f</tspan><tspan dy="6" font-size="14">i</tspan><tspan dy="-6">v</tspan><tspan dy="-7" font-size="14">i</tspan><tspan dy="7"> 不随换基改变。对偶基满足 e</tspan><tspan dy="-7" font-size="14">i</tspan><tspan dy="7">·e</tspan><tspan dy="6" font-size="14">j</tspan><tspan dy="-6"> = δ</tspan><tspan dy="-7" font-size="14">i</tspan><tspan dy="13" font-size="14">j</tspan><tspan dy="-6">。</tspan></text>
</svg>
