<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#131312"/>

  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">

    <!-- 标题 -->
    <text x="800" y="74" text-anchor="middle" font-size="44" font-weight="700" fill="#E5E7EB">图的应用：节点和边不变，问题变了</text>
    <line x1="80" y1="106" x2="1520" y2="106" stroke="#2E2E2E" stroke-width="1"/>
    <line x1="800" y1="132" x2="800" y2="726" stroke="#2E2E2E" stroke-width="1" stroke-dasharray="6 8"/>

    <!-- 分栏标题 -->
    <rect x="68" y="140" width="6" height="34" rx="3" fill="#A78BFA"/>
    <text x="92" y="170" font-size="34" font-weight="700" fill="#E5E7EB">社交网络</text>
    <rect x="862" y="140" width="6" height="34" rx="3" fill="#A78BFA"/>
    <text x="886" y="170" font-size="34" font-weight="700" fill="#E5E7EB">地图导航</text>

    <!-- ================= 左：社交网络 ================= -->
    <g stroke="#6B7280" stroke-width="2.5" stroke-linecap="round">
      <line x1="165" y1="320" x2="290" y2="235"/>
      <line x1="290" y1="235" x2="470" y2="320"/>
      <line x1="470" y1="320" x2="505" y2="490"/>
    </g>

    <polyline points="165,320 320,420 505,490 680,490" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 节点 -->
    <g font-size="30" font-weight="700" fill="#E5E7EB" text-anchor="middle">
      <circle cx="165" cy="320" r="30" fill="#1E1E2E" stroke="#34D399" stroke-width="3"/>
      <text x="165" y="330.5">A</text>
      <circle cx="290" cy="235" r="30" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
      <text x="290" y="245.5">B</text>
      <circle cx="320" cy="420" r="30" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
      <text x="320" y="430.5">C</text>
      <circle cx="470" cy="320" r="30" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
      <text x="470" y="330.5">D</text>
      <circle cx="505" cy="490" r="30" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
      <text x="505" y="500.5">E</text>
      <circle cx="680" cy="490" r="30" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
      <text x="680" y="500.5">F</text>
    </g>

    <text x="88" y="598" font-size="30" font-weight="600" fill="#F59E0B">A 和 F 是几度好友？→ BFS 数层数</text>
    <text x="88" y="650" font-size="28" fill="#9CA3AF">无向边 = 互相关注</text>
    <text x="88" y="692" font-size="28" fill="#9CA3AF">有向边 = 单向关注</text>

    <!-- ================= 右：地图导航 ================= -->
    <g stroke="#6B7280" stroke-width="2.5" stroke-linecap="round">
      <line x1="900" y1="390" x2="1080" y2="265"/>
      <line x1="1080" y1="505" x2="1280" y2="385"/>
    </g>

    <!-- 最短路高亮带箭头 -->
    <g stroke="#F59E0B" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
      <line x1="932" y1="410" x2="1043" y2="481"/>
      <line x1="1080" y1="467" x2="1080" y2="309"/>
      <line x1="1113" y1="285" x2="1242" y2="362"/>
      <line x1="1318" y1="385" x2="1421" y2="385"/>
    </g>

    <!-- 节点 -->
    <g font-size="30" font-weight="700" fill="#E5E7EB" text-anchor="middle">
      <circle cx="900" cy="390" r="32" fill="#1E1E2E" stroke="#34D399" stroke-width="3"/>
      <text x="900" y="400.5">甲</text>
      <circle cx="1080" cy="265" r="32" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
      <text x="1080" y="275.5">乙</text>
      <circle cx="1080" cy="505" r="32" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
      <text x="1080" y="515.5">丙</text>
      <circle cx="1280" cy="385" r="32" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
      <text x="1280" y="395.5">丁</text>
      <circle cx="1465" cy="385" r="32" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
      <text x="1465" y="395.5">戊</text>
    </g>

    <!-- 权重 -->
    <g font-size="28" font-weight="700" text-anchor="middle">
      <text x="973" y="313" fill="#9CA3AF">4</text>
      <text x="974" y="483" fill="#F59E0B">2</text>
      <text x="1108" y="395" fill="#F59E0B">1</text>
      <text x="1165" y="361" fill="#F59E0B">5</text>
      <text x="1195" y="481" fill="#9CA3AF">8</text>
      <text x="1372" y="363" fill="#F59E0B">3</text>
    </g>

    <text x="880" y="600" font-size="30" font-weight="600" fill="#F59E0B">最短路径 甲→丙→乙→丁→戊</text>
    <text x="880" y="648" font-size="32" font-weight="700" fill="#F59E0B">总长 2 + 1 + 5 + 3 = 11</text>
    <text x="880" y="700" font-size="28" fill="#9CA3AF">城市是节点，道路是带权边；求最短路 → Dijkstra</text>

    <!-- 底部注释 -->
    <line x1="200" y1="744" x2="1400" y2="744" stroke="#2E2E2E" stroke-width="1"/>
    <text x="800" y="792" text-anchor="middle" font-size="28" fill="#9CA3AF">同一个图结构：BFS 解决无权最短步数，Dijkstra 解决带权最短路</text>
    <text x="800" y="834" text-anchor="middle" font-size="28" fill="#9CA3AF">社交网络、地图、网页链接、任务依赖都是图</text>

  </g>
</svg>
