<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="arrowPurple" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Backdrop -->
  <rect x="0" y="0" width="1500" height="900" fill="#0B0B0F"/>

  <!-- Title -->
  <text x="70" y="66" font-size="40" font-weight="600" fill="#E5E7EB">SVD：正交基穿过 A 的旅程</text>
  <text x="72" y="104" font-size="22" fill="#9CA3AF">行空间的单位正交基被 A 送到列空间的单位正交基；零空间整体压成 0</text>

  <!-- Panels -->
  <rect x="70" y="170" width="610" height="590" rx="24" fill="#FFFFFF" fill-opacity="0.025" stroke="#2E2E2E" stroke-width="1.5"/>
  <rect x="820" y="170" width="610" height="590" rx="24" fill="#FFFFFF" fill-opacity="0.025" stroke="#2E2E2E" stroke-width="1.5"/>

  <text x="100" y="215" font-size="27" font-weight="600" fill="#E5E7EB">输入空间 ℝⁿ</text>
  <text x="850" y="215" font-size="27" font-weight="600" fill="#E5E7EB">输出空间 ℝᵐ</text>

  <!-- LEFT: row space plane -->
  <polygon points="140,620 370,300 640,360 410,680" fill="#A78BFA" fill-opacity="0.045" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="185" y="612" font-size="20" fill="#C4B5FD">行空间 C(Aᵀ)，dim = r</text>

  <!-- LEFT: orthonormal row-space basis -->
  <line x1="400" y1="470" x2="550" y2="470" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <line x1="400" y1="470" x2="400" y2="320" stroke="#22D3EE" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowCyan)"/>
  <path d="M 420 470 L 420 450 L 400 450" fill="none" stroke="#9CA3AF" stroke-width="1.6"/>
  <circle cx="400" cy="470" r="4.5" fill="#E5E7EB"/>

  <text x="475" y="505" font-size="24" fill="#A78BFA" text-anchor="middle">v₁</text>
  <text x="475" y="530" font-size="18" fill="#9CA3AF" text-anchor="middle">‖v₁‖ = 1</text>
  <text x="414" y="368" font-size="24" fill="#22D3EE">v₂</text>
  <text x="414" y="393" font-size="18" fill="#9CA3AF">‖v₂‖ = 1</text>

  <!-- LEFT: null space, outside the plane -->
  <line x1="190" y1="722" x2="310" y2="722" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#arrowGray)"/>
  <circle cx="190" cy="722" r="3.8" fill="#9CA3AF"/>
  <text x="250" y="700" font-size="22" fill="#9CA3AF" text-anchor="middle">w</text>
  <text x="330" y="728" font-size="20" fill="#9CA3AF">N(A) → 0</text>
  <text x="190" y="752" font-size="18" fill="#9CA3AF" fill-opacity="0.8">dim = n − r</text>

  <!-- RIGHT: column space plane -->
  <polygon points="880,620 1100,300 1380,360 1160,680" fill="#22D3EE" fill-opacity="0.045" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="920" y="615" font-size="20" fill="#67E8F9">列空间 C(A)，dim = r</text>

  <!-- RIGHT: stretched column-space basis -->
  <line x1="1130" y1="480" x2="1285" y2="480" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <line x1="1130" y1="480" x2="1130" y2="380" stroke="#22D3EE" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowCyan)"/>
  <path d="M 1150 480 L 1150 460 L 1130 460" fill="none" stroke="#9CA3AF" stroke-width="1.6"/>
  <circle cx="1130" cy="480" r="4.5" fill="#E5E7EB"/>

  <text x="1180" y="520" font-size="20" fill="#A78BFA" text-anchor="middle">σ₁u₁ (σ₁ &gt; 0)</text>
  <text x="1150" y="375" font-size="20" fill="#22D3EE">σ₂u₂ (σ₂ &gt; 0)</text>

  <!-- RIGHT: left null space, outside the plane -->
  <line x1="880" y1="718" x2="990" y2="718" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#arrowGray)"/>
  <circle cx="880" cy="718" r="3.8" fill="#9CA3AF"/>
  <text x="1010" y="700" font-size="20" fill="#9CA3AF">左零空间 N(Aᵀ)</text>
  <text x="1010" y="735" font-size="18" fill="#9CA3AF" fill-opacity="0.85">没有输入落到这里</text>

  <!-- CENTRAL MAP A -->
  <text x="750" y="390" font-size="20" fill="#E5E7EB" text-anchor="middle">A <tspan fill="#A78BFA">v₁</tspan> = <tspan fill="#A78BFA">σ₁u₁</tspan></text>
  <text x="750" y="445" font-size="34" font-weight="700" fill="#F59E0B" text-anchor="middle">A</text>
  <line x1="690" y1="472" x2="810" y2="472" stroke="#F59E0B" stroke-width="7.5" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <text x="750" y="548" font-size="20" fill="#E5E7EB" text-anchor="middle">A <tspan fill="#22D3EE">v₂</tspan> = <tspan fill="#22D3EE">σ₂u₂</tspan></text>

  <!-- BOTTOM FORMULAS -->
  <line x1="70" y1="795" x2="1430" y2="795" stroke="#2E2E2E" stroke-width="1"/>
  <text x="750" y="835" font-size="26" fill="#E5E7EB" text-anchor="middle" xml:space="preserve">A = <tspan fill="#A78BFA">U</tspan><tspan fill="#F59E0B">Σ</tspan><tspan fill="#22D3EE">Vᵀ</tspan>    <tspan fill="#A78BFA">UᵀU</tspan> = I,   <tspan fill="#22D3EE">VᵀV</tspan> = I,   <tspan fill="#F59E0B">σᵢ</tspan> ≥ 0</text>
  <text x="750" y="868" font-size="18" fill="#9CA3AF" text-anchor="middle">秩 r = <tspan fill="#F59E0B">Σ</tspan> 中非零对角元的个数</text>
</svg>
