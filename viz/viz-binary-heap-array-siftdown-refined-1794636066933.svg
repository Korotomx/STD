<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="960" viewBox="0 0 1560 960">
  <rect width="1560" height="960" fill="#131312"/>

  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">

    <!-- dashed index correspondence: array cell -> tree node -->
    <g stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="6 8" opacity="0.26" fill="none">
      <line x1="110" y1="766" x2="1000" y2="190"/>
      <line x1="200" y1="766" x2="820" y2="380"/>
      <line x1="290" y1="766" x2="1180" y2="380"/>
      <line x1="380" y1="766" x2="730" y2="570"/>
      <line x1="470" y1="766" x2="910" y2="570"/>
      <line x1="560" y1="766" x2="1090" y2="570"/>
      <line x1="650" y1="766" x2="1270" y2="570"/>
    </g>

    <!-- tree edges -->
    <g stroke="#6B7280" stroke-width="2.5" fill="none">
      <line x1="1000" y1="190" x2="820" y2="380"/>
      <line x1="1000" y1="190" x2="1180" y2="380"/>
      <line x1="820" y1="380" x2="730" y2="570"/>
      <line x1="820" y1="380" x2="910" y2="570"/>
      <line x1="1180" y1="380" x2="1090" y2="570"/>
      <line x1="1180" y1="380" x2="1270" y2="570"/>
    </g>

    <!-- complete binary tree, initial values -->
    <g fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5">
      <circle cx="1000" cy="190" r="42"/>
      <circle cx="820" cy="380" r="42"/>
      <circle cx="1180" cy="380" r="42"/>
      <circle cx="730" cy="570" r="42"/>
      <circle cx="910" cy="570" r="42"/>
      <circle cx="1090" cy="570" r="42"/>
      <circle cx="1270" cy="570" r="42"/>
    </g>
    <g fill="#E5E7EB" font-size="30" font-weight="500" text-anchor="middle">
      <text x="1000" y="200">4</text>
      <text x="820" y="390">10</text>
      <text x="1180" y="390">3</text>
      <text x="730" y="580">5</text>
      <text x="910" y="580">1</text>
      <text x="1090" y="580">2</text>
      <text x="1270" y="580">8</text>
    </g>

    <!-- index of each tree node -->
    <g fill="#9CA3AF" font-size="17" font-weight="500" text-anchor="middle">
      <text x="1062" y="196">0</text>
      <text x="820" y="330">1</text>
      <text x="1180" y="330">2</text>
      <text x="730" y="514">3</text>
      <text x="910" y="514">4</text>
      <text x="1090" y="514">5</text>
      <text x="1270" y="514">6</text>
    </g>

    <!-- array cells -->
    <g fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5">
      <rect x="70"  y="770" width="80" height="84" rx="10"/>
      <rect x="160" y="770" width="80" height="84" rx="10"/>
      <rect x="250" y="770" width="80" height="84" rx="10"/>
      <rect x="340" y="770" width="80" height="84" rx="10"/>
      <rect x="430" y="770" width="80" height="84" rx="10"/>
      <rect x="520" y="770" width="80" height="84" rx="10"/>
      <rect x="610" y="770" width="80" height="84" rx="10"/>
    </g>
    <g fill="#E5E7EB" font-size="30" font-weight="500" text-anchor="middle">
      <text x="110" y="826">4</text>
      <text x="200" y="826">10</text>
      <text x="290" y="826">3</text>
      <text x="380" y="826">5</text>
      <text x="470" y="826">1</text>
      <text x="560" y="826">2</text>
      <text x="650" y="826">8</text>
    </g>
    <g fill="#9CA3AF" font-size="20" text-anchor="middle">
      <text x="110" y="890">0</text>
      <text x="200" y="890">1</text>
      <text x="290" y="890">2</text>
      <text x="380" y="890">3</text>
      <text x="470" y="890">4</text>
      <text x="560" y="890">5</text>
      <text x="650" y="890">6</text>
    </g>

    <!-- step 1: i = 2, swap node 3 with right child 8 -->
    <path d="M1221.58 360.31 C1271.3 336.8 1361.3 526.8 1311.58 550.31"
          fill="none" stroke="#F59E0B" stroke-width="2.4"/>
    <polygon points="1221.58,360.31 1237.92,359.76 1232.36,348.02" fill="#F59E0B"/>
    <polygon points="1311.58,550.31 1327.92,549.76 1322.36,538.02" fill="#F59E0B"/>
    <circle cx="1395" cy="405" r="19" fill="#131312" stroke="#F59E0B" stroke-width="2.2"/>
    <text x="1395" y="412" fill="#F59E0B" font-size="20" font-weight="700" text-anchor="middle">1</text>
    <text x="1395" y="450" fill="#E5E7EB" font-size="21" text-anchor="middle">i = 2 <tspan fill="#9CA3AF">交换</tspan></text>

    <!-- step 2: i = 1, node 10 already satisfies heap property -->
    <circle cx="770" cy="280" r="19" fill="#131312" stroke="#F59E0B" stroke-width="2.2"/>
    <text x="770" y="287" fill="#F59E0B" font-size="20" font-weight="700" text-anchor="middle">2</text>
    <text x="735" y="288" fill="#E5E7EB" font-size="21" text-anchor="end">i = 1 <tspan fill="#9CA3AF">已满足</tspan></text>

    <!-- step 3: i = 0, two swaps on the sift-down path -->
    <path d="M966.60 158.37 C926.7 120.6 746.7 310.6 786.60 348.37"
          fill="none" stroke="#F59E0B" stroke-width="2.4"/>
    <polygon points="966.60,158.37 960.18,143.33 951.24,152.77" fill="#F59E0B"/>
    <polygon points="786.60,348.37 780.18,333.33 771.24,342.77" fill="#F59E0B"/>

    <path d="M820 426 C820 486 836 570 776 570"
          fill="none" stroke="#F59E0B" stroke-width="2.4"/>
    <polygon points="820,426 826.5,441 813.5,441" fill="#F59E0B"/>
    <polygon points="776,570 791,576.5 791,563.5" fill="#F59E0B"/>

    <circle cx="930" cy="84" r="19" fill="#131312" stroke="#F59E0B" stroke-width="2.2"/>
    <text x="930" y="91" fill="#F59E0B" font-size="20" font-weight="700" text-anchor="middle">3</text>
    <text x="962" y="91" fill="#E5E7EB" font-size="21">i = 0</text>
    <text x="962" y="123" fill="#9CA3AF" font-size="20">4↔10 → 4↔5</text>

    <!-- legend: step badge -> i -->
    <text x="890" y="918" fill="#6B7280" font-size="18">建堆顺序</text>

    <circle cx="1005" cy="912" r="14" fill="#131312" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="1005" y="918" fill="#F59E0B" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="1026" y="918" fill="#9CA3AF" font-size="19">i = 2</text>

    <circle cx="1136" cy="912" r="14" fill="#131312" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="1136" y="918" fill="#F59E0B" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="1157" y="918" fill="#9CA3AF" font-size="19">i = 1</text>

    <circle cx="1267" cy="912" r="14" fill="#131312" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="1267" y="918" fill="#F59E0B" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="1288" y="918" fill="#9CA3AF" font-size="19">i = 0</text>

  </g>
</svg>
