<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#131312"/>

  <!-- Title -->
  <text x="800" y="78" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="46" font-weight="600" fill="#E5E7EB">哈希表应用：一遍扫描统计词频</text>

  <!-- Input stream -->
  <text x="800" y="143" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="28" fill="#9CA3AF">输入词流（从左到右逐个扫描）</text>

  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" fill="#E5E7EB" text-anchor="middle">
    <rect x="545" y="170" width="70" height="70" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <text x="580" y="216">a</text>
    <rect x="655" y="170" width="70" height="70" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <text x="690" y="216">b</text>
    <rect x="765" y="170" width="70" height="70" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <text x="800" y="216">a</text>
    <rect x="875" y="170" width="70" height="70" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <text x="910" y="216">c</text>
    <rect x="985" y="170" width="70" height="70" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <text x="1020" y="216">a</text>
  </g>

  <g stroke="#6B7280" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="617" y1="205" x2="650" y2="205"/>
    <line x1="727" y1="205" x2="760" y2="205"/>
    <line x1="837" y1="205" x2="870" y2="205"/>
    <line x1="947" y1="205" x2="980" y2="205"/>
    <line x1="800" y1="240" x2="800" y2="284"/>
  </g>

  <!-- Hash function -->
  <rect x="640" y="288" width="320" height="90" rx="16" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="800" y="346" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" fill="#A78BFA">hash(key) % 5</text>

  <!-- Assumed mapping note -->
  <line x1="962" y1="333" x2="1004" y2="333" stroke="#2E2E2E" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="1015" y="307" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="28" fill="#9CA3AF">假设映射（示例）</text>
  <text x="1015" y="345" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="28" fill="#9CA3AF">hash(a)%5=1，hash(b)%5=3</text>
  <text x="1015" y="383" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="28" fill="#9CA3AF">hash(c)%5=4</text>

  <!-- Distribution bus from hash output to buckets -->
  <g stroke="#6B7280" stroke-width="2.5" fill="none">
    <line x1="800" y1="378" x2="800" y2="446"/>
    <line x1="280" y1="446" x2="1320" y2="446"/>
  </g>
  <g stroke="#6B7280" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="280" y1="446" x2="280" y2="516"/>
    <line x1="540" y1="446" x2="540" y2="516"/>
    <line x1="800" y1="446" x2="800" y2="516"/>
    <line x1="1060" y1="446" x2="1060" y2="516"/>
    <line x1="1320" y1="446" x2="1320" y2="516"/>
  </g>

  <!-- Buckets -->
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
    <!-- bucket 0 -->
    <rect x="180" y="520" width="200" height="160" rx="14" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <text x="280" y="552" text-anchor="middle" font-size="28" fill="#9CA3AF">0</text>
    <text x="280" y="614" text-anchor="middle" font-size="28" fill="#9CA3AF" opacity="0.45">空</text>

    <!-- bucket 1 -->
    <rect x="440" y="520" width="200" height="160" rx="14" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <text x="540" y="552" text-anchor="middle" font-size="28" fill="#9CA3AF">1</text>
    <rect x="465" y="576" width="150" height="64" rx="10" fill="#131312" stroke="#34D399" stroke-width="2"/>
    <text x="540" y="619" text-anchor="middle" font-size="30" fill="#E5E7EB"><tspan fill="#34D399" font-weight="600">a</tspan><tspan fill="#9CA3AF"> : </tspan><tspan>3</tspan></text>

    <!-- bucket 2 -->
    <rect x="700" y="520" width="200" height="160" rx="14" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <text x="800" y="552" text-anchor="middle" font-size="28" fill="#9CA3AF">2</text>
    <text x="800" y="614" text-anchor="middle" font-size="28" fill="#9CA3AF" opacity="0.45">空</text>

    <!-- bucket 3 -->
    <rect x="960" y="520" width="200" height="160" rx="14" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <text x="1060" y="552" text-anchor="middle" font-size="28" fill="#9CA3AF">3</text>
    <rect x="985" y="576" width="150" height="64" rx="10" fill="#131312" stroke="#34D399" stroke-width="2"/>
    <text x="1060" y="619" text-anchor="middle" font-size="30" fill="#E5E7EB"><tspan fill="#34D399" font-weight="600">b</tspan><tspan fill="#9CA3AF"> : </tspan><tspan>1</tspan></text>

    <!-- bucket 4 -->
    <rect x="1220" y="520" width="200" height="160" rx="14" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <text x="1320" y="552" text-anchor="middle" font-size="28" fill="#9CA3AF">4</text>
    <rect x="1245" y="576" width="150" height="64" rx="10" fill="#131312" stroke="#34D399" stroke-width="2"/>
    <text x="1320" y="619" text-anchor="middle" font-size="30" fill="#E5E7EB"><tspan fill="#34D399" font-weight="600">c</tspan><tspan fill="#9CA3AF"> : </tspan><tspan>1</tspan></text>

    <!-- Bottom notes -->
    <text x="800" y="762" text-anchor="middle" font-size="28" fill="#E5E7EB">扫描一遍：每个词 O(1) 平均时间，总 O(词数)</text>
    <text x="800" y="808" text-anchor="middle" font-size="28" fill="#9CA3AF">若用有序数组查重：每个词 O(log n)，总 O(n log n)</text>
    <text x="800" y="854" text-anchor="middle" font-size="28" fill="#9CA3AF"><tspan fill="#A78BFA">应用：</tspan>词频统计 · 去重 · 缓存索引 · 数据库哈希索引</text>
  </g>
</svg>
