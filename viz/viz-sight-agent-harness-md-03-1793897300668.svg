<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 360px; background-color: rgb(19, 19, 18);" viewBox="4 4 360 240" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#my-svg{font-family:Noto Sans CJK SC,Noto Sans CJK JP,sans-serif;font-size:16px;fill:#E6E6E6;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#181818;}#my-svg .error-text{fill:#e7e7e7;stroke:#e7e7e7;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#8A8A8A;stroke:#8A8A8A;}#my-svg .marker.cross{stroke:#8A8A8A;}#my-svg svg{font-family:Noto Sans CJK SC,Noto Sans CJK JP,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .label{font-family:Noto Sans CJK SC,Noto Sans CJK JP,sans-serif;color:#E6E6E6;}#my-svg .cluster-label text{fill:#EE8F4E;}#my-svg .cluster-label span{color:#EE8F4E;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#E6E6E6;color:#E6E6E6;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#1C1C1C;stroke:#EE8F4E;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .labe