  </defs>
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
    <text x="800" y="64" fill="#E5E7EB" font-size="44" font-weight="600" text-anchor="middle">LRU：哈希表定位，双向链表排队</text>
    <text x="800" y="108" fill="#9CA3AF" font-size="26" text-anchor="middle">容量 = 3　｜　哈希表给出节点指针，双向链表调整顺序——两步都是 O(1)</text>
