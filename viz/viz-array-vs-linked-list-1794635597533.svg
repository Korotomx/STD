<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#131312"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <!-- tiny legend -->
  <text x="948" y="130" text-anchor="end" font-size="14" fill="#9CA3AF">&#19978;&#65306;&#36830;&#32493;</text>
  <text x="948" y="154" text-anchor="end" font-size="14" fill="#9CA3AF">&#19979;&#65306;&#20998;&#25955;</text>

  <!-- ===== Top: contiguous array ===== -->
  <g>
    <text x="290" y="96" text-anchor="middle" font-size="18" fill="#9CA3AF">a[0]</text>
    <text x="430" y="96" text-anchor="middle" font-size="18" fill="#9CA3AF">a[1]</text>
    <text x="570" y="96" text-anchor="middle" font-size="18" fill="#9CA3AF">a[2]</text>
    <text x="710" y="96" text-anchor="middle" font-size="18" fill="#9CA3AF">a[3]</text>

    <rect x="220" y="112" width="140" height="90" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <rect x="360" y="112" width="140" height="90" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <rect x="500" y="112" width="140" height="90" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <rect x="640" y="112" width="140" height="90" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>

    <text x="290" y="167" text-anchor="middle" font-size="30" fill="#E5E7EB">4</text>
    <text x="430" y="167" text-anchor="middle" font-size="30" fill="#E5E7EB">7</text>
    <text x="570" y="167" text-anchor="middle" font-size="30" fill="#E5E7EB">9</text>
    <text x="710" y="167" text-anchor="middle" font-size="30" fill="#E5E7EB">12</text>

    <line x1="290" y1="204" x2="290" y2="230" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="430" y1="204" x2="430" y2="230" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="570" y1="204" x2="570" y2="230" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="710" y1="204" x2="710" y2="230" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="290" y="252" text-anchor="middle" font-size="17" font-family="Noto Sans Mono, monospace" fill="#A78BFA" font-weight="600">B</text>
    <text x="430" y="252" text-anchor="middle" font-size="17" font-family="Noto Sans Mono, monospace" fill="#9CA3AF">B + 4</text>
    <text x="570" y="252" text-anchor="middle" font-size="17" font-family="Noto Sans Mono, monospace" fill="#9CA3AF">B + 8</text>
    <text x="710" y="252" text-anchor="middle" font-size="17" font-family="Noto Sans Mono, monospace" fill="#9CA3AF">B + 12</text>

    <line x1="290" y1="286" x2="710" y2="286" stroke="#A78BFA" stroke-width="1.5" opacity="0.75" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)"/>
    <text x="500" y="310" text-anchor="middle" font-size="15" fill="#9CA3AF">3 &#215; 4</text>
    <text x="500" y="344" text-anchor="middle" font-size="18" fill="#9CA3AF">&#22320;&#22336; = B + i &#215; 4</text>
  </g>

  <!-- ===== Bottom: scattered linked nodes (value | next) ===== -->
  <g>
    <!-- node 4 -->
    <g>
      <rect x="100" y="380" width="160" height="90" rx="6" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
      <line x1="180" y1="380" x2="180" y2="470" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
      <text x="140" y="436" text-anchor="middle" font-size="30" fill="#E5E7EB">4</text>
      <text x="220" y="408" text-anchor="middle" font-size="13" fill="#9CA3AF">next</text>
    </g>
    <!-- node 7 -->
    <g>
      <rect x="310" y="520" width="160" height="90" rx="6" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
      <line x1="390" y1="520" x2="390" y2="610" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
      <text x="350" y="576" text-anchor="middle" font-size="30" fill="#E5E7EB">7</text>
      <text x="430" y="548" text-anchor="middle" font-size="13" fill="#9CA3AF">next</text>
    </g>
    <!-- node 9 -->
    <g>
      <rect x="520" y="390" width="160" height="90" rx="6" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
      <line x1="600" y1="390" x2="600" y2="480" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
      <text x="560" y="446" text-anchor="middle" font-size="30" fill="#E5E7EB">9</text>
      <text x="640" y="418" text-anchor="middle" font-size="13" fill="#9CA3AF">next</text>
    </g>
    <!-- node 12 -->
    <g>
      <rect x="730" y="520" width="160" height="90" rx="6" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
      <line x1="810" y1="520" x2="810" y2="610" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
      <text x="770" y="576" text-anchor="middle" font-size="30" fill="#E5E7EB">12</text>
      <text x="850" y="548" text-anchor="middle" font-size="13" fill="#9CA3AF">next</text>
    </g>

    <!-- pointer arrows: start inside next field, pass through its right border -->
    <circle cx="220" cy="425" r="2.5" fill="#A78BFA"/>
    <path d="M220,425 Q285,425 310,565" fill="none" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrow)"/>

    <circle cx="430" cy="565" r="2.5" fill="#A78BFA"/>
    <path d="M430,565 Q495,565 520,435" fill="none" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrow)"/>

    <circle cx="640" cy="435" r="2.5" fill="#A78BFA"/>
    <path d="M640,435 Q705,435 730,565" fill="none" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrow)"/>

    <circle cx="850" cy="565" r="2.5" fill="#A78BFA"/>
    <line x1="850" y1="565" x2="906" y2="565" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="930" y="576" text-anchor="middle" font-size="28" fill="#9CA3AF">&#8709;</text>
  </g>
</svg>
