<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <defs>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E5E7EB"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1000" height="680" fill="#131312"/>

  <!-- keys -->
  <rect x="60" y="90" width="150" height="60" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="135" y="120" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="26" fill="#E5E7EB">apple</text>

  <rect x="60" y="210" width="150" height="60" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="135" y="240" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="26" fill="#E5E7EB">apply</text>

  <!-- key -> hash arrows -->
  <line x1="210" y1="120" x2="300" y2="152" stroke="#E5E7EB" stroke-width="2.5" marker-end="url(#arrowInk)"/>
  <line x1="210" y1="240" x2="300" y2="200" stroke="#E5E7EB" stroke-width="2.5" marker-end="url(#arrowInk)"/>

  <!-- hash function -->
  <rect x="300" y="120" width="220" height="110" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="410" y="175" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="26" fill="#E5E7EB">h(key) mod m</text>

  <!-- hash outputs -> bucket 3 (both keys collide here) -->
  <line x1="520" y1="195" x2="690" y2="358" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#arrowAccent)"/>
  <line x1="520" y1="222" x2="740" y2="358" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#arrowAccent)"/>

  <!-- buckets -->
  <rect x="480" y="360" width="130" height="100" rx="8" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="545" y="405" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#9CA3AF">桶 2</text>

  <rect x="650" y="360" width="130" height="100" rx="8" fill="#1E1E2E" stroke="#A78BFA" stroke-width="3.5"/>
  <text x="715" y="405" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">桶 3</text>

  <rect x="820" y="360" width="130" height="100" rx="8" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="885" y="405" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#9CA3AF">桶 4</text>

  <!-- chain hanging from bucket 3 -->
  <line x1="715" y1="460" x2="715" y2="500" stroke="#A78BFA" stroke-width="2.5"/>

  <rect x="635" y="500" width="160" height="52" rx="8" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="715" y="526" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">apple → 1</text>

  <line x1="715" y1="552" x2="715" y2="580" stroke="#A78BFA" stroke-width="2.5"/>

  <rect x="635" y="580" width="160" height="52" rx="8" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="715" y="606" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">apply → 2</text>
</svg>
