<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <rect width="1600" height="900" fill="#131312"/>

  <!-- Title -->
  <text x="800" y="48" text-anchor="middle" font-size="44" font-weight="700" fill="#E5E7EB">堆应用：大小为 3 的小顶堆筛 Top-K</text>

  <!-- Data flow -->
  <text x="800" y="84" text-anchor="middle" font-size="28" fill="#9CA3AF">数据流：<tspan fill="#E5E7EB">88</tspan> <tspan fill="#6B7280">→</tspan> <tspan fill="#E5E7EB">95</tspan> <tspan fill="#6B7280">→</tspan> <tspan fill="#E5E7EB">70</tspan> <tspan fill="#6B7280">→</tspan> <tspan fill="#E5E7EB">99</tspan> <tspan fill="#6B7280">→</tspan> <tspan fill="#E5E7EB">82</tspan> <tspan fill="#6B7280">→</tspan> <tspan fill="#E5E7EB">91</tspan></text>

  <!-- Card 1 -->
  <rect x="25" y="98" width="250" height="552" rx="14" fill="#18181B" stroke="#2A2A30" stroke-width="1.5"/>
  <text x="150" y="144" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB"><tspan fill="#A78BFA">①</tspan> 读 88</text>
  <circle cx="150" cy="298" r="26" fill="#1E1E2E" stroke="#34D399" stroke-width="3"/>
  <text x="150" y="308" text-anchor="middle" font-size="28" fill="#34D399">88</text>
  <text x="150" y="474" text-anchor="middle" font-size="28" fill="#34D399">直接入堆</text>
  <text x="150" y="508" text-anchor="middle" font-size="28" fill="#9CA3AF">大小 1（未满 3）</text>
  <text x="150" y="544" text-anchor="middle" font-size="28" fill="#E5E7EB">堆 {88}</text>
  <text x="150" y="580" text-anchor="middle" font-size="28" fill="#9CA3AF">堆顶 = 88</text>
  <text x="150" y="616" text-anchor="middle" font-size="28" fill="#34D399">88 入堆并保留</text>

  <!-- Card 2 -->
  <rect x="285" y="98" width="250" height="552" rx="14" fill="#18181B" stroke="#2A2A30" stroke-width="1.5"/>
  <text x="410" y="144" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB"><tspan fill="#A78BFA">②</tspan> 读 95</text>
  <line x1="410" y1="238" x2="352" y2="332" stroke="#6B7280" stroke-width="2.5"/>
  <circle cx="410" cy="238" r="26" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="410" y="248" text-anchor="middle" font-size="28" fill="#E5E7EB">88</text>
  <circle cx="352" cy="332" r="26" fill="#1E1E2E" stroke="#34D399" stroke-width="3"/>
  <text x="352" y="342" text-anchor="middle" font-size="28" fill="#34D399">95</text>
  <text x="410" y="474" text-anchor="middle" font-size="28" fill="#34D399">直接入堆</text>
  <text x="410" y="508" text-anchor="middle" font-size="28" fill="#9CA3AF">大小 2（未满 3）</text>
  <text x="410" y="544" text-anchor="middle" font-size="28" fill="#E5E7EB">堆 {88, 95}</text>
  <text x="410" y="580" text-anchor="middle" font-size="28" fill="#9CA3AF">堆顶 88（最小）</text>
  <text x="410" y="616" text-anchor="middle" font-size="28" fill="#34D399">95 入堆并保留</text>

  <!-- Card 3 -->
  <rect x="545" y="98" width="250" height="552" rx="14" fill="#18181B" stroke="#2A2A30" stroke-width="1.5"/>
  <text x="670" y="144" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB"><tspan fill="#A78BFA">③</tspan> 读 70</text>
  <line x1="670" y1="238" x2="612" y2="332" stroke="#6B7280" stroke-width="2.5"/>
  <line x1="670" y1="238" x2="728" y2="332" stroke="#6B7280" stroke-width="2.5"/>
  <circle cx="670" cy="238" r="26" fill="#1E1E2E" stroke="#34D399" stroke-width="3"/>
  <text x="670" y="248" text-anchor="middle" font-size="28" fill="#34D399">70</text>
  <circle cx="612" cy="332" r="26" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="612" y="342" text-anchor="middle" font-size="28" fill="#E5E7EB">88</text>
  <circle cx="728" cy="332" r="26" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="728" y="342" text-anchor="middle" font-size="28" fill="#E5E7EB">95</text>
  <text x="670" y="474" text-anchor="middle" font-size="28" fill="#34D399">直接入堆</text>
  <text x="670" y="508" text-anchor="middle" font-size="28" fill="#9CA3AF">大小 3（已满 k）</text>
  <text x="670" y="544" text-anchor="middle" font-size="28" fill="#E5E7EB">堆 {70, 88, 95}</text>
  <text x="670" y="580" text-anchor="middle" font-size="28" fill="#9CA3AF">堆顶 70（最小）</text>
  <text x="670" y="616" text-anchor="middle" font-size="28" fill="#34D399">70 入堆即堆顶</text>

  <!-- Card 4 -->
  <rect x="805" y="98" width="250" height="552" rx="14" fill="#18181B" stroke="#2A2A30" stroke-width="1.5"/>
  <text x="930" y="144" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB"><tspan fill="#A78BFA">④</tspan> 读 99</text>
  <line x1="930" y1="238" x2="872" y2="332" stroke="#6B7280" stroke-width="2.5"/>
  <line x1="930" y1="238" x2="988" y2="332" stroke="#6B7280" stroke-width="2.5"/>
  <circle cx="930" cy="238" r="26" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="930" y="248" text-anchor="middle" font-size="28" fill="#E5E7EB">88</text>
  <circle cx="872" cy="332" r="26" fill="#1E1E2E" stroke="#34D399" stroke-width="3"/>
  <text x="872" y="342" text-anchor="middle" font-size="28" fill="#34D399">99</text>
  <circle cx="988" cy="332" r="26" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="988" y="342" text-anchor="middle" font-size="28" fill="#E5E7EB">95</text>
  <circle cx="930" cy="422" r="24" fill="#1E1E2E" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="930" y="432" text-anchor="middle" font-size="28" fill="#E5484D">70</text>
  <path d="M950 393 L960 403 M960 393 L950 403" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
  <text x="930" y="474" text-anchor="middle" font-size="28" fill="#E5484D">弹出最小 70</text>
  <text x="930" y="508" text-anchor="middle" font-size="28" fill="#9CA3AF">大小 4 → 3</text>
  <text x="930" y="544" text-anchor="middle" font-size="28" fill="#E5E7EB">堆 {88, 95, 99}</text>
  <text x="930" y="580" text-anchor="middle" font-size="28" fill="#9CA3AF">堆顶 = 第 3 大</text>
  <text x="930" y="616" text-anchor="middle" font-size="28" fill="#34D399">99 入堆并保留</text>

  <!-- Card 5 -->
  <rect x="1065" y="98" width="250" height="552" rx="14" fill="#18181B" stroke="#2A2A30" stroke-width="1.5"/>
  <text x="1190" y="144" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB"><tspan fill="#A78BFA">⑤</tspan> 读 82</text>
  <line x1="1190" y1="238" x2="1132" y2="332" stroke="#6B7280" stroke-width="2.5"/>
  <line x1="1190" y1="238" x2="1248" y2="332" stroke="#6B7280" stroke-width="2.5"/>
  <circle cx="1190" cy="238" r="26" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="1190" y="248" text-anchor="middle" font-size="28" fill="#E5E7EB">88</text>
  <circle cx="1132" cy="332" r="26" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="1132" y="342" text-anchor="middle" font-size="28" fill="#E5E7EB">95</text>
  <circle cx="1248" cy="332" r="26" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="1248" y="342" text-anchor="middle" font-size="28" fill="#E5E7EB">99</text>
  <circle cx="1190" cy="422" r="24" fill="#1E1E2E" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="1190" y="432" text-anchor="middle" font-size="28" fill="#E5484D">82</text>
  <path d="M1210 393 L1220 403 M1220 393 L1210 403" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
  <text x="1190" y="474" text-anchor="middle" font-size="28" fill="#E5484D">弹出 82</text>
  <text x="1190" y="508" text-anchor="middle" font-size="28" fill="#9CA3AF">大小 4 → 3</text>
  <text x="1190" y="544" text-anchor="middle" font-size="28" fill="#E5E7EB">堆 {88, 95, 99}</text>
  <text x="1190" y="580" text-anchor="middle" font-size="28" fill="#9CA3AF">堆顶 = 第 3 大</text>
  <text x="1190" y="616" text-anchor="middle" font-size="28" fill="#E5484D">82 刚进就弹出</text>

  <!-- Card 6 -->
  <rect x="1325" y="98" width="250" height="552" rx="14" fill="#18181B" stroke="#2A2A30" stroke-width="1.5"/>
  <text x="1450" y="144" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB"><tspan fill="#A78BFA">⑥</tspan> 读 91</text>
  <line x1="1450" y1="238" x2="1392" y2="332" stroke="#6B7280" stroke-width="2.5"/>
  <line x1="1450" y1="238" x2="1508" y2="332" stroke="#6B7280" stroke-width="2.5"/>
  <circle cx="1450" cy="238" r="26" fill="#1E1E2E" stroke="#34D399" stroke-width="3"/>
  <text x="1450" y="248" text-anchor="middle" font-size="28" fill="#34D399">91</text>
  <circle cx="1392" cy="332" r="26" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="1392" y="342" text-anchor="middle" font-size="28" fill="#E5E7EB">95</text>
  <circle cx="1508" cy="332" r="26" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="1508" y="342" text-anchor="middle" font-size="28" fill="#E5E7EB">99</text>
  <circle cx="1450" cy="422" r="24" fill="#1E1E2E" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="1450" y="432" text-anchor="middle" font-size="28" fill="#E5484D">88</text>
  <path d="M1470 393 L1480 403 M1480 393 L1470 403" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
  <text x="1450" y="474" text-anchor="middle" font-size="28" fill="#E5484D">弹出 88</text>
  <text x="1450" y="508" text-anchor="middle" font-size="28" fill="#9CA3AF">大小 4 → 3</text>
  <text x="1450" y="544" text-anchor="middle" font-size="28" fill="#E5E7EB">堆 {91, 95, 99}</text>
  <text x="1450" y="580" text-anchor="middle" font-size="28" fill="#9CA3AF">堆顶 = 第 3 大</text>
  <text x="1450" y="616" text-anchor="middle" font-size="28" fill="#34D399">91 入堆并保留</text>

  <!-- Result bar -->
  <rect x="25" y="664" width="1550" height="54" rx="12" fill="#18181B" stroke="#2E2E2E" stroke-width="1.5"/>
  <text x="800" y="700" text-anchor="middle" font-size="34" xml:space="preserve"><tspan fill="#9CA3AF">Top-3 = </tspan><tspan fill="#E5E7EB" font-weight="700">99, 95, 91</tspan></text>

  <!-- Bottom notes -->
  <text x="800" y="760" text-anchor="middle" font-size="30" fill="#9CA3AF">堆里最多 <tspan fill="#E5E7EB">k</tspan> 个元素；满后堆顶即当前第 <tspan fill="#E5E7EB">k</tspan> 大</text>
  <text x="800" y="802" text-anchor="middle" font-size="30" fill="#9CA3AF">每个元素入堆/弹堆 <tspan fill="#E5E7EB">O(log k)</tspan>，总 <tspan fill="#E5E7EB">O(n log k)</tspan>，空间 <tspan fill="#E5E7EB">O(k)</tspan></text>
  <text x="800" y="844" text-anchor="middle" font-size="30" fill="#9CA3AF">若全排序再取前 <tspan fill="#E5E7EB">k</tspan>：<tspan fill="#E5E7EB">O(n log n)</tspan></text>
</svg>
