<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#131312"/>

  <!-- Title -->
  <text x="800" y="76" font-size="46" font-weight="700" text-anchor="middle" fill="#E5E7EB">并查集应用：Kruskal 选边，成环就跳过</text>

  <!-- Left heading -->
  <text x="70" y="152" font-size="30" fill="#E5E7EB">最终 MST：A-B、C-D、B-C、D-E，总权重 <tspan fill="#34D399" font-weight="700">11</tspan></text>

  <!-- Graph: rejected edge A-C (arc below) -->
  <path d="M 140 400 Q 310 555 480 400" fill="none" stroke="#E5484D" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Graph: accepted MST edges -->
  <line x1="140" y1="400" x2="310" y2="400" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>
  <line x1="310" y1="400" x2="480" y2="400" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>
  <line x1="480" y1="400" x2="650" y2="400" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>
  <line x1="650" y1="400" x2="820" y2="400" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="140" cy="400" r="32" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <circle cx="310" cy="400" r="32" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <circle cx="480" cy="400" r="32" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <circle cx="650" cy="400" r="32" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <circle cx="820" cy="400" r="32" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="140" y="411" font-size="32" text-anchor="middle" fill="#E5E7EB">A</text>
  <text x="310" y="411" font-size="32" text-anchor="middle" fill="#E5E7EB">B</text>
  <text x="480" y="411" font-size="32" text-anchor="middle" fill="#E5E7EB">C</text>
  <text x="650" y="411" font-size="32" text-anchor="middle" fill="#E5E7EB">D</text>
  <text x="820" y="411" font-size="32" text-anchor="middle" fill="#E5E7EB">E</text>

  <!-- Edge weights -->
  <text x="225" y="358" font-size="32" font-weight="700" text-anchor="middle" fill="#34D399">1</text>
  <text x="395" y="358" font-size="32" font-weight="700" text-anchor="middle" fill="#34D399">3</text>
  <text x="565" y="358" font-size="32" font-weight="700" text-anchor="middle" fill="#34D399">2</text>
  <text x="735" y="358" font-size="32" font-weight="700" text-anchor="middle" fill="#34D399">5</text>

  <!-- Rejected edge marker: X + weight -->
  <circle cx="310" cy="477" r="15" fill="#131312"/>
  <line x1="298" y1="465" x2="322" y2="489" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <line x1="298" y1="489" x2="322" y2="465" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  <text x="310" y="545" font-size="32" font-weight="700" text-anchor="middle" fill="#E5484D">4</text>

  <!-- Legend -->
  <line x1="110" y1="625" x2="190" y2="625" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>
  <text x="205" y="636" font-size="28" fill="#9CA3AF">选中边（MST）</text>
  <line x1="450" y1="625" x2="530" y2="625" stroke="#E5484D" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="545" y="636" font-size="28" fill="#9CA3AF">被拒（会成环）</text>

  <!-- Separator -->
  <line x1="60" y1="752" x2="1540" y2="752" stroke="#2E2E2E" stroke-width="1"/>

  <!-- Bottom note -->
  <text x="800" y="792" font-size="28" text-anchor="middle" fill="#9CA3AF">每条边做两次 find；并查集让「是否同组」近似 O(1)，</text>
  <text x="800" y="834" font-size="28" text-anchor="middle" fill="#9CA3AF">Kruskal 总代价由排序 O(E log E) 主导</text>

  <!-- Step cards -->
  <!-- Step 1 -->
  <rect x="900" y="140" width="660" height="104" rx="14" fill="#1A1A24" stroke="#2E2E2E" stroke-width="1.5"/>
  <rect x="902" y="156" width="5" height="72" rx="2.5" fill="#34D399"/>
  <circle cx="950" cy="192" r="23" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
  <text x="950" y="202" font-size="26" text-anchor="middle" fill="#E5E7EB">1</text>
  <text x="992" y="181" font-size="28" fill="#E5E7EB">选 A-B（权重 1）</text>
  <text x="1524" y="181" font-size="28" text-anchor="end" fill="#34D399" font-weight="700">接受</text>
  <text x="992" y="220" font-size="28" fill="#9CA3AF">find(A) ≠ find(B) → 合并 {A,B}</text>

  <!-- Step 2 -->
  <rect x="900" y="258" width="660" height="104" rx="14" fill="#1A1A24" stroke="#2E2E2E" stroke-width="1.5"/>
  <rect x="902" y="274" width="5" height="72" rx="2.5" fill="#34D399"/>
  <circle cx="950" cy="310" r="23" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
  <text x="950" y="320" font-size="26" text-anchor="middle" fill="#E5E7EB">2</text>
  <text x="992" y="299" font-size="28" fill="#E5E7EB">选 C-D（权重 2）</text>
  <text x="1524" y="299" font-size="28" text-anchor="end" fill="#34D399" font-weight="700">接受</text>
  <text x="992" y="338" font-size="28" fill="#9CA3AF">find(C) ≠ find(D) → 合并 {C,D}</text>

  <!-- Step 3 -->
  <rect x="900" y="376" width="660" height="104" rx="14" fill="#1A1A24" stroke="#2E2E2E" stroke-width="1.5"/>
  <rect x="902" y="392" width="5" height="72" rx="2.5" fill="#34D399"/>
  <circle cx="950" cy="428" r="23" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
  <text x="950" y="438" font-size="26" text-anchor="middle" fill="#E5E7EB">3</text>
  <text x="992" y="417" font-size="28" fill="#E5E7EB">选 B-C（权重 3）</text>
  <text x="1524" y="417" font-size="28" text-anchor="end" fill="#34D399" font-weight="700">接受</text>
  <text x="992" y="456" font-size="28" fill="#9CA3AF">find(B) ≠ find(C) → 连通 {A,B,C,D}</text>

  <!-- Step 4 -->
  <rect x="900" y="494" width="660" height="104" rx="14" fill="#1A1A24" stroke="#2E2E2E" stroke-width="1.5"/>
  <rect x="902" y="510" width="5" height="72" rx="2.5" fill="#E5484D"/>
  <circle cx="950" cy="546" r="23" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
  <text x="950" y="556" font-size="26" text-anchor="middle" fill="#E5E7EB">4</text>
  <text x="992" y="535" font-size="28" fill="#E5E7EB">选 A-C（权重 4）</text>
  <text x="1524" y="535" font-size="28" text-anchor="end" fill="#E5484D" font-weight="700">拒绝</text>
  <text x="992" y="574" font-size="28" fill="#9CA3AF">find(A) == find(C) → 会成环，跳过</text>

  <!-- Step 5 -->
  <rect x="900" y="612" width="660" height="104" rx="14" fill="#1A1A24" stroke="#2E2E2E" stroke-width="1.5"/>
  <rect x="902" y="628" width="5" height="72" rx="2.5" fill="#34D399"/>
  <circle cx="950" cy="664" r="23" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
  <text x="950" y="674" font-size="26" text-anchor="middle" fill="#E5E7EB">5</text>
  <text x="992" y="653" font-size="28" fill="#E5E7EB">选 D-E（权重 5）</text>
  <text x="1524" y="653" font-size="28" text-anchor="end" fill="#34D399" font-weight="700">接受</text>
  <text x="992" y="692" font-size="28" fill="#9CA3AF">find(D) ≠ find(E) → 全部连通</text>
</svg>
