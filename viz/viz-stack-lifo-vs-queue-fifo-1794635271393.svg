<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 40 960 500">
  <rect x="0" y="0" width="960" height="560" fill="#131312"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E5E7EB"/>
    </marker>
  </defs>

  <!-- ================= LEFT: STACK (LIFO) ================= -->
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
    <!-- cells, bottom 1 to top 3 -->
    <rect x="185" y="408" width="130" height="72" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <rect x="185" y="332" width="130" height="72" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <rect x="185" y="256" width="130" height="72" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>

    <text x="250" y="453" text-anchor="middle" font-size="28" fill="#E5E7EB">1</text>
    <text x="250" y="377" text-anchor="middle" font-size="28" fill="#E5E7EB">2</text>
    <text x="250" y="301" text-anchor="middle" font-size="28" fill="#E5E7EB">3</text>

    <!-- top label -->
    <text x="168" y="252" text-anchor="end" font-size="22" fill="#9CA3AF">top</text>

    <!-- push: down into top -->
    <line x1="230" y1="152" x2="230" y2="256" stroke="#E5E7EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="230" y="140" text-anchor="middle" font-size="22" fill="#E5E7EB">push</text>

    <!-- pop: up out of top -->
    <line x1="290" y1="256" x2="290" y2="152" stroke="#E5E7EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="290" y="140" text-anchor="middle" font-size="22" fill="#E5E7EB">pop</text>
  </g>

  <!-- ================= RIGHT: QUEUE (FIFO) ================= -->
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
    <!-- cells, front (left) to back (right) -->
    <rect x="540" y="324" width="106" height="80" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <rect x="652" y="324" width="106" height="80" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <rect x="764" y="324" width="106" height="80" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>

    <text x="593" y="375" text-anchor="middle" font-size="28" fill="#E5E7EB">1</text>
    <text x="705" y="375" text-anchor="middle" font-size="28" fill="#E5E7EB">2</text>
    <text x="817" y="375" text-anchor="middle" font-size="28" fill="#E5E7EB">3</text>

    <!-- dequeue: out of front (left) -->
    <line x1="536" y1="364" x2="478" y2="364" stroke="#E5E7EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="507" y="302" text-anchor="middle" font-size="22" fill="#E5E7EB">dequeue</text>

    <!-- enqueue: into back (from right) -->
    <line x1="926" y1="364" x2="876" y2="364" stroke="#E5E7EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="901" y="302" text-anchor="middle" font-size="22" fill="#E5E7EB">enqueue</text>

    <!-- front / back labels -->
    <text x="540" y="444" text-anchor="middle" font-size="22" fill="#9CA3AF">front</text>
    <line x1="540" y1="409" x2="540" y2="422" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>

    <text x="870" y="444" text-anchor="middle" font-size="22" fill="#9CA3AF">back</text>
    <line x1="870" y1="409" x2="870" y2="422" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
</svg>
