<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" font-family="Noto Sans CJK SC, Noto Sans CJK JP, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrowAccent" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10.5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L10.5,6 L1.5,10.5" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowMutedEnd" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowMutedStart" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8.5,1.5 L1.5,5 L8.5,8.5" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="650" fill="#131312"/>

  <!-- title -->
  <text x="500" y="50" text-anchor="middle" font-size="24" fill="#E5E7EB">Dirac 记号：ket、bra、算子与伴随</text>

  <!-- boxes -->
  <rect x="70" y="100" width="300" height="110" rx="10" fill="#1A1A19" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="630" y="100" width="300" height="110" rx="10" fill="#1A1A19" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="70" y="360" width="300" height="110" rx="10" fill="#1A1A19" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="630" y="360" width="300" height="110" rx="10" fill="#1A1A19" stroke="#E5E7EB" stroke-width="2"/>

  <!-- top-left: V, ket space, column vector icon -->
  <path d="M112 125 L100 125 L100 185 L112 185" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M148 125 L160 125 L160 185 L148 185" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="149" text-anchor="middle" font-size="17" fill="#E5E7EB">v<tspan dy="4" font-size="12">1</tspan></text>
  <text x="130" y="171" text-anchor="middle" font-size="17" fill="#E5E7EB">v<tspan dy="4" font-size="12">2</tspan></text>
  <text x="270" y="150" text-anchor="middle" font-style="italic" font-size="28" fill="#E5E7EB">V</text>
  <text x="270" y="177" text-anchor="middle" font-size="18" fill="#9CA3AF">ket 空间</text>

  <!-- top-right: V, ket after A -->
  <text x="780" y="150" text-anchor="middle" font-style="italic" font-size="28" fill="#E5E7EB">V</text>
  <text x="780" y="177" text-anchor="middle" font-size="18" fill="#9CA3AF">ket · A 作用后</text>

  <!-- bottom-left: V*, bra after A-dagger -->
  <text x="220" y="410" text-anchor="middle"><tspan font-style="italic" font-size="28" fill="#E5E7EB">V</tspan><tspan dy="-9" font-size="19" fill="#E5E7EB">*</tspan></text>
  <text x="220" y="437" text-anchor="middle" font-size="18" fill="#9CA3AF">bra · A<tspan font-family="DejaVu Math TeX Gyre">†</tspan> 作用后</text>

  <!-- bottom-right: V*, bra space, row vector icon -->
  <path d="M655 396 L645 396 L645 434 L655 434" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M710 396 L720 396 L720 434 L710 434" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="670" y="420" text-anchor="middle" font-size="16" fill="#E5E7EB">w<tspan dy="4" font-size="11">1</tspan></text>
  <text x="698" y="420" text-anchor="middle" font-size="16" fill="#E5E7EB">w<tspan dy="4" font-size="11">2</tspan></text>
  <text x="840" y="410" text-anchor="middle"><tspan font-style="italic" font-size="28" fill="#E5E7EB">V</tspan><tspan dy="-9" font-size="19" fill="#E5E7EB">*</tspan></text>
  <text x="840" y="437" text-anchor="middle" font-size="18" fill="#9CA3AF">bra 空间</text>

  <!-- top arrow: A, left to right -->
  <line x1="374" y1="155" x2="624" y2="155" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowAccent)"/>
  <text x="500" y="132" text-anchor="middle" font-size="22" fill="#A78BFA">A</text>
  <text x="500" y="182" text-anchor="middle" font-size="18" fill="#E5E7EB">|v⟩ → A|v⟩</text>

  <!-- bottom arrow: A-dagger, right to left -->
  <line x1="626" y1="415" x2="376" y2="415" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowAccent)"/>
  <text x="500" y="392" text-anchor="middle" font-size="22" fill="#A78BFA">A<tspan font-family="DejaVu Math TeX Gyre">†</tspan></text>
  <text x="500" y="442" text-anchor="middle" font-size="18" fill="#E5E7EB">⟨w| → ⟨w|A<tspan font-family="DejaVu Math TeX Gyre">†</tspan></text>

  <!-- vertical Riesz arrows, dashed -->
  <line x1="220" y1="214" x2="220" y2="356" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="7 6" marker-start="url(#arrowMutedStart)" marker-end="url(#arrowMutedEnd)"/>
  <text x="236" y="292" font-size="18" fill="#9CA3AF">Riesz</text>
  <line x1="780" y1="214" x2="780" y2="356" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="7 6" marker-start="url(#arrowMutedStart)" marker-end="url(#arrowMutedEnd)"/>
  <text x="764" y="292" text-anchor="end" font-size="18" fill="#9CA3AF">Riesz</text>

  <!-- center equation -->
  <text x="500" y="540" text-anchor="middle" font-size="30" fill="#E5E7EB" font-family="DejaVu Math TeX Gyre">⟨w|A|v⟩ = ⟨w, A v⟩ = ⟨A† w, v⟩</text>

  <!-- footnote -->
  <text x="500" y="602" text-anchor="middle" font-size="18" fill="#9CA3AF">(AB)<tspan font-family="DejaVu Math TeX Gyre">†</tspan> = B<tspan font-family="DejaVu Math TeX Gyre">†</tspan> A<tspan font-family="DejaVu Math TeX Gyre">†</tspan>；bra 是 V* 中的泛函，ket 是 V 中的向量。</text>
</svg>
