<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#131312"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <!-- ===== Top: contiguous array ===== -->
  <g>
    <text x="290" y="96" text-anchor="middle" font-size="19" fill="#9CA3AF">a[0]</text>
    <text x="430" y="96" text-anchor="middle" font-size="19" fill="#9CA3AF">a[1]</text>
    <text x="570" y="96" text-anchor="middle" font-size="19" fill="#9CA3AF">a[2]</text>
    <text x="710" y="96" text-anchor="middle" font-size="19" fill="#9CA3AF">a[3]</text>

    <rect x="220" y="112" width="140" height="90" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <rect x="360" y="112" width="140" height="90" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <rect x="500" y="112" width="140" height="90" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
    <rect x="640" y="112" width="140" height="90" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>

    <text x="290" y="167" text-anchor="middle" font-size="30" fill="#E5E7EB">4</text>
    <text x="430" y="167" text-anchor="middle" font-size="30" fill="#E5E7EB">7</text>
    <text x="570" y="167" text-anchor="middle" font-size="30" fill="#E5E7EB">9</text>
    <text x="710" y="167" text-anchor="middle" font-size="30" fill="#E5E7EB">12</text>

    <line x1="290" y1="204" x2="290" y2="230" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="430" y1="204" x2="430" y2="230" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="570" y1="204" x2="570" y2="230" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="710" y1="204" x2="710" y2="230" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="290" y="252" text-anchor="middle" font-size="16" font-family="Noto Sans Mono, monospace" fill="#A78BFA" font-weight="600">B</text>
    <text x="430" y="252" text-anchor="middle" font-size="16" font-family="Noto Sans Mono, monospace" fill="#9CA3AF">B + size</text>
    <text x="570" y="252" text-anchor="middle" font-size="16" font-family="Noto Sans Mono, monospace" fill="#9CA3AF">B + 2&#183;size</text>
    <text x="710" y="252" text-anchor="middle" font-size="16" font-family="Noto Sans Mono, monospace" fill="#9CA3AF">B + 3&#183;size</text>

    <line x1="290" y1="286" x2="710" y2="286" stroke="#A78BFA" stroke-width="1.5" opacity="0.75" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)"/>
    <text x="500" y="312" text-anchor="middle" font-size="16" fill="#9CA3AF">i &#215; size</text>
    <text x="500" y="348" text-anchor="middle" font-size="19" fill="#9CA3AF">&#22320;&#22336; = B + i &#215; size</text>
  </g>

  <!-- ===== Bottom: scattered linked nodes ===== -->
  <g>
    <!-- node 4 -->
    <g>
      <rect x="100" y="390" width="150" height="90" rx="6" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
      <line x1="170" y1="390" x2="170" y2="480" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
      <text x="135" y="446" text-anchor="middle" font-size="30" fill="#E5E7EB">4</text>
      <text x="210" y="440" text-anchor="middle" font-size="13" fill="#9CA3AF">next</text>
    </g>
    <!-- node 7 -->
    <g>
      <rect x="310" y="525" width="150" height="90" rx="6" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
      <line x1="380" y1="525" x2="380" y2="615" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
      <text x="345" y="581" text-anchor="middle" font-size="30" fill="#E5E7EB">7</text>
      <text x="420" y="575" text-anchor="middle" font-size="13" fill="#9CA3AF">next</text>
    </g>
    <!-- node 9 -->
    <g>
      <rect x="520" y="385" width="150" height="90" rx="6" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
      <line x1="590" y1="385" x2="590" y2="475" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
      <text x="555" y="441" text-anchor="middle" font-size="30" fill="#E5E7EB">9</text>
      <text x="630" y="435" text-anchor="middle" font-size="13" fill="#9CA3AF">next</text>
    </g>
    <!-- node 12 -->
    <g>
      <rect x="730" y="520" width="150" height="90" rx="6" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
      <line x1="800" y1="520" x2="800" y2="610" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
      <text x="765" y="576" text-anchor="middle" font-size="30" fill="#E5E7EB">12</text>
      <text x="840" y="570" text-anchor="middle" font-size="13" fill="#9CA3AF">next</text>
    </g>

    <!-- arrows -->
    <line x1="250" y1="435" x2="310" y2="570" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="460" y1="570" x2="520" y2="430" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="670" y1="430" x2="730" y2="565" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="880" y1="565" x2="896" y2="565" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrow)"/>

    <text x="906" y="574" font-size="22" font-family="Noto Sans Mono, monospace" fill="#9CA3AF">null</text>
  </g>
</svg>
