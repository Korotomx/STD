<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#131312"/>
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">

    <!-- Title -->
    <text x="800" y="96" text-anchor="middle" font-size="52" font-weight="700" fill="#E5E7EB">gcd 取指数 <tspan fill="#A78BFA">min</tspan>，lcm 取指数 <tspan fill="#A78BFA">max</tspan></text>

    <!-- Column headers -->
    <text x="650" y="236" text-anchor="middle" font-size="40" font-weight="600" fill="#34D399">12 = 2² × 3¹</text>
    <text x="1010" y="236" text-anchor="middle" font-size="40" font-weight="600" fill="#F59E0B">18 = 2¹ × 3²</text>

    <!-- Row labels -->
    <text x="540" y="313" text-anchor="end" font-size="28" fill="#9CA3AF">素数 2 的指数</text>
    <text x="540" y="423" text-anchor="end" font-size="28" fill="#9CA3AF">素数 3 的指数</text>

    <!-- 12 exponent squares (green): 2^2, 3^1 -->
    <g fill="#34D399">
      <rect x="580" y="270" width="64" height="64" rx="12"/>
      <rect x="656" y="270" width="64" height="64" rx="12"/>
      <rect x="580" y="380" width="64" height="64" rx="12"/>
    </g>

    <!-- 18 exponent squares (orange): 2^1, 3^2 -->
    <g fill="#F59E0B">
      <rect x="940" y="270" width="64" height="64" rx="12"/>
      <rect x="940" y="380" width="64" height="64" rx="12"/>
      <rect x="1016" y="380" width="64" height="64" rx="12"/>
    </g>

    <!-- min / max tags -->
    <g>
      <rect x="736" y="284" width="68" height="36" rx="18" fill="#1E1E2E" stroke="#A78BFA" stroke-width="1.8"/>
      <text x="770" y="310" text-anchor="middle" font-size="22" font-weight="600" fill="#A78BFA">max</text>

      <rect x="1020" y="284" width="68" height="36" rx="18" fill="#1E1E2E" stroke="#A78BFA" stroke-width="1.8"/>
      <text x="1054" y="310" text-anchor="middle" font-size="22" font-weight="600" fill="#A78BFA">min</text>

      <rect x="660" y="394" width="68" height="36" rx="18" fill="#1E1E2E" stroke="#A78BFA" stroke-width="1.8"/>
      <text x="694" y="420" text-anchor="middle" font-size="22" font-weight="600" fill="#A78BFA">min</text>

      <rect x="1096" y="394" width="68" height="36" rx="18" fill="#1E1E2E" stroke="#A78BFA" stroke-width="1.8"/>
      <text x="1130" y="420" text-anchor="middle" font-size="22" font-weight="600" fill="#A78BFA">max</text>
    </g>

    <!-- Divider -->
    <line x1="300" y1="505" x2="1300" y2="505" stroke="#2E2E2E" stroke-width="1.5" stroke-dasharray="4 10"/>

    <!-- gcd line -->
    <text x="800" y="585" text-anchor="middle" font-size="40" fill="#E5E7EB"><tspan fill="#A78BFA" font-weight="700">gcd</tspan> = 2^<tspan fill="#A78BFA" font-weight="600">min</tspan>(2,1) × 3^<tspan fill="#A78BFA" font-weight="600">min</tspan>(1,2) = 2¹ × 3¹ = <tspan fill="#A78BFA" font-weight="700">6</tspan></text>

    <!-- lcm line -->
    <text x="800" y="660" text-anchor="middle" font-size="40" fill="#E5E7EB"><tspan fill="#A78BFA" font-weight="700">lcm</tspan> = 2^<tspan fill="#A78BFA" font-weight="600">max</tspan>(2,1) × 3^<tspan fill="#A78BFA" font-weight="600">max</tspan>(1,2) = 2² × 3² = <tspan fill="#A78BFA" font-weight="700">36</tspan></text>

    <!-- Bottom identity box -->
    <rect x="300" y="706" width="1000" height="150" rx="20" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="800" y="770" text-anchor="middle" font-size="48" font-weight="700" fill="#E5E7EB"><tspan fill="#A78BFA">6</tspan> × <tspan fill="#A78BFA">36</tspan> = 216 = <tspan fill="#34D399">12</tspan> × <tspan fill="#F59E0B">18</tspan></text>
    <text x="800" y="824" text-anchor="middle" font-size="30" fill="#9CA3AF">min + max = 原指数，所以 <tspan fill="#E5E7EB">gcd × lcm = |ab|</tspan></text>

  </g>
</svg>
