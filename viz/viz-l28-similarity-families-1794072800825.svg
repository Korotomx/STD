<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#0B0B0F"/>

  <!-- root -->
  <rect x="440" y="26" width="320" height="64" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2"/>
  <text x="600" y="66" text-anchor="middle" font-size="22" fill="#E5E7EB">特征多项式 (λ−4)²</text>

  <!-- connectors -->
  <path d="M600 90 V126 M285 126 H855 M285 126 V158 M855 126 V158" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- left family container -->
  <rect x="100" y="158" width="370" height="412" rx="14" fill="#12121A" stroke="#6E62A8" stroke-width="1.5"/>
  <text x="285" y="192" text-anchor="middle" font-size="19" fill="#E5E7EB">单人家庭</text>

  <rect x="170" y="270" width="230" height="190" rx="12" fill="#1E1E2E" stroke="#6E62A8" stroke-width="1.5"/>
  <text x="285" y="312" text-anchor="middle" font-size="22" fill="#C9BEEA">{4<tspan font-family="DejaVu Serif, serif" font-style="italic">I</tspan>}</text>

  <!-- 4I matrix -->
  <path d="M237 347 H229 V423 H237" fill="none" stroke="#6E62A8" stroke-width="2"/>
  <path d="M333 347 H341 V423 H333" fill="none" stroke="#6E62A8" stroke-width="2"/>
  <text x="251" y="365" text-anchor="middle" font-size="24" fill="#E5E7EB">4</text>
  <text x="319" y="365" text-anchor="middle" font-size="24" fill="#E5E7EB">0</text>
  <text x="251" y="421" text-anchor="middle" font-size="24" fill="#E5E7EB">0</text>
  <text x="319" y="421" text-anchor="middle" font-size="24" fill="#E5E7EB">4</text>

  <text x="285" y="536" text-anchor="middle" font-size="17" fill="#9CA3AF">唯一成员只与自身相似，几何重数 = 2</text>

  <!-- right family container -->
  <rect x="560" y="158" width="590" height="412" rx="14" fill="#12121A" stroke="#A78BFA" stroke-width="1.6"/>
  <text x="855" y="190" text-anchor="middle" font-size="19" fill="#E5E7EB">缺陷家族</text>

  <!-- J2 representative -->
  <rect x="775" y="210" width="160" height="120" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="1.6"/>
  <text x="855" y="238" text-anchor="middle" font-size="18" fill="#A78BFA">J₂(4)</text>
  <path d="M811 252 H803 V324 H811" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M899 252 H907 V324 H899" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <text x="823" y="269" text-anchor="middle" font-size="20" fill="#E5E7EB">4</text>
  <text x="887" y="269" text-anchor="middle" font-size="20" fill="#E5E7EB">1</text>
  <text x="823" y="321" text-anchor="middle" font-size="20" fill="#E5E7EB">0</text>
  <text x="887" y="321" text-anchor="middle" font-size="20" fill="#E5E7EB">4</text>

  <!-- member A -->
  <rect x="640" y="384" width="160" height="120" rx="10" fill="#1E1E2E" stroke="#22D3EE" stroke-width="1.5"/>
  <path d="M676 408 H668 V480 H676" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M764 408 H772 V480 H764" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <text x="688" y="425" text-anchor="middle" font-size="20" fill="#E5E7EB">5</text>
  <text x="752" y="425" text-anchor="middle" font-size="20" fill="#E5E7EB">1</text>
  <text x="688" y="477" text-anchor="middle" font-size="20" fill="#E5E7EB">−1</text>
  <text x="752" y="477" text-anchor="middle" font-size="20" fill="#E5E7EB">3</text>

  <!-- member B -->
  <rect x="910" y="384" width="160" height="120" rx="10" fill="#1E1E2E" stroke="#22D3EE" stroke-width="1.5"/>
  <path d="M946 408 H938 V480 H946" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M1034 408 H1042 V480 H1034" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <text x="958" y="425" text-anchor="middle" font-size="20" fill="#E5E7EB">4</text>
  <text x="1022" y="425" text-anchor="middle" font-size="20" fill="#E5E7EB">17</text>
  <text x="958" y="477" text-anchor="middle" font-size="20" fill="#E5E7EB">0</text>
  <text x="1022" y="477" text-anchor="middle" font-size="20" fill="#E5E7EB">4</text>

  <!-- similarity arrows -->
  <path d="M810 331 L745 382" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M900 331 L965 382" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M806 444 L904 444" fill="none" stroke="#A78BFA" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text x="762" y="352" text-anchor="end" font-size="16" fill="#A78BFA">相似</text>
  <text x="948" y="352" text-anchor="start" font-size="16" fill="#A78BFA">相似</text>
  <text x="855" y="428" text-anchor="middle" font-size="15" fill="#A78BFA">相似</text>

  <text x="855" y="536" text-anchor="middle" font-size="17" fill="#9CA3AF">所有成员只有一个线性无关的特征向量，几何重数 = 1</text>

  <!-- caption -->
  <line x1="120" y1="605" x2="1080" y2="605" stroke="#2E2E2E" stroke-width="1" stroke-dasharray="4 6"/>
  <text x="600" y="648" text-anchor="middle" font-size="20" fill="#E5E7EB">同谱不等于相似；特征值 4,4 的 2×2 矩阵分成两个相似类。</text>
</svg>
