<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600">
  <defs>
    <marker id="arrowMuted" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowInk" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#E5E7EB"/>
    </marker>
    <marker id="arrowAccent" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L13,5 L0,10 z" fill="#A78BFA"/>
    </marker>
    <clipPath id="leftClip">
      <rect x="64" y="88" width="432" height="432"/>
    </clipPath>
    <clipPath id="rightClip">
      <rect x="640" y="84" width="480" height="440"/>
    </clipPath>
  </defs>

  <rect width="1240" height="600" fill="#131312"/>

  <!-- panel titles -->
  <text x="280" y="56" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="500" fill="#E5E7EB">输入平面</text>
  <text x="880" y="56" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-weight="500" fill="#E5E7EB">输出平面</text>

  <!-- ================= LEFT PANEL: input plane ================= -->
  <g clip-path="url(#leftClip)">
    <!-- square grid, one line per unit; x,y in [-2,7] -->
    <g stroke="#2E2E2E" stroke-width="1">
      <line x1="64" y1="88" x2="64" y2="520"/>
      <line x1="112" y1="88" x2="112" y2="520"/>
      <line x1="160" y1="88" x2="160" y2="520"/>
      <line x1="208" y1="88" x2="208" y2="520"/>
      <line x1="256" y1="88" x2="256" y2="520"/>
      <line x1="304" y1="88" x2="304" y2="520"/>
      <line x1="352" y1="88" x2="352" y2="520"/>
      <line x1="400" y1="88" x2="400" y2="520"/>
      <line x1="448" y1="88" x2="448" y2="520"/>
      <line x1="496" y1="88" x2="496" y2="520"/>
      <line x1="64" y1="88" x2="496" y2="88"/>
      <line x1="64" y1="136" x2="496" y2="136"/>
      <line x1="64" y1="184" x2="496" y2="184"/>
      <line x1="64" y1="232" x2="496" y2="232"/>
      <line x1="64" y1="280" x2="496" y2="280"/>
      <line x1="64" y1="328" x2="496" y2="328"/>
      <line x1="64" y1="376" x2="496" y2="376"/>
      <line x1="64" y1="424" x2="496" y2="424"/>
      <line x1="64" y1="472" x2="496" y2="472"/>
      <line x1="64" y1="520" x2="496" y2="520"/>
    </g>

    <!-- axes -->
    <g stroke="#4A4A5A" stroke-width="2">
      <line x1="64" y1="424" x2="496" y2="424"/>
      <line x1="160" y1="520" x2="160" y2="88"/>
    </g>
    <!-- decomposition guides, drawn beneath the vectors -->
    <g stroke="#E5E7EB" stroke-width="2" stroke-opacity="0.65" stroke-dasharray="7 6" fill="none">
      <line x1="160" y1="424" x2="352" y2="424"/>
      <line x1="160" y1="424" x2="160" y2="184"/>
      <line x1="352" y1="424" x2="352" y2="184"/>
      <line x1="160" y1="184" x2="352" y2="184"/>
    </g>

    <!-- basis vectors -->
    <line x1="160" y1="424" x2="208" y2="424" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#arrowMuted)"/>
    <line x1="160" y1="424" x2="160" y2="376" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#arrowMuted)"/>

    <!-- vector (4,5) -->
    <line x1="160" y1="424" x2="352" y2="184" stroke="#E5E7EB" stroke-width="3" marker-end="url(#arrowInk)"/>

    <!-- origin dot -->
    <circle cx="160" cy="424" r="3" fill="#E5E7EB"/>

    <!-- labels -->
    <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" paint-order="stroke" stroke="#131312" stroke-width="4" stroke-linejoin="round">
      <text x="185" y="448" text-anchor="middle" fill="#9CA3AF">e₁</text>
      <text x="142" y="392" text-anchor="end" fill="#9CA3AF">e₂</text>
      <text x="368" y="176" text-anchor="start" fill="#E5E7EB">v = (4,5)</text>
      <text x="352" y="450" text-anchor="middle" fill="#9CA3AF">4e₁</text>
      <text x="150" y="180" text-anchor="end" fill="#9CA3AF">5e₂</text>
    </g>
  </g>

  <!-- axis labels (outside the panel clip so they are not cut off) -->
  <text x="489" y="414" text-anchor="end" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="14" fill="#9CA3AF">x</text>
  <text x="170" y="102" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="14" fill="#9CA3AF">y</text>

  <!-- ================= RIGHT PANEL: output plane ================= -->
  <g clip-path="url(#rightClip)">
    <!-- skew lattice: lines of constant n (direction a1) -->
    <g stroke="#A78BFA" stroke-width="1.2" stroke-opacity="0.30">
      <line x1="162" y1="1043" x2="1602" y2="323"/>
      <line x1="144" y1="989" x2="1584" y2="269"/>
      <line x1="126" y1="935" x2="1566" y2="215"/>
      <line x1="108" y1="881" x2="1548" y2="161"/>
      <line x1="90" y1="827" x2="1530" y2="107"/>
      <line x1="72" y1="773" x2="1512" y2="53"/>
      <line x1="54" y1="719" x2="1494" y2="-1"/>
      <line x1="36" y1="665" x2="1476" y2="-55"/>
      <line x1="18" y1="611" x2="1458" y2="-109"/>
      <line x1="0" y1="557" x2="1440" y2="-163"/>
      <line x1="-18" y1="503" x2="1422" y2="-217"/>
      <line x1="-36" y1="449" x2="1404" y2="-271"/>
      <line x1="-54" y1="395" x2="1386" y2="-325"/>
      <!-- lines of constant m (direction a2) -->
      <line x1="1098" y1="1583" x2="378" y2="-577"/>
      <line x1="1134" y1="1565" x2="414" y2="-595"/>
      <line x1="1170" y1="1547" x2="450" y2="-613"/>
      <line x1="1206" y1="1529" x2="486" y2="-631"/>
      <line x1="1242" y1="1511" x2="522" y2="-649"/>
      <line x1="1278" y1="1493" x2="558" y2="-667"/>
      <line x1="1314" y1="1475" x2="594" y2="-685"/>
      <line x1="1350" y1="1457" x2="630" y2="-703"/>
      <line x1="1386" y1="1439" x2="666" y2="-721"/>
      <line x1="1422" y1="1421" x2="702" y2="-739"/>
      <line x1="1458" y1="1403" x2="738" y2="-757"/>
      <line x1="1494" y1="1385" x2="774" y2="-775"/>
      <line x1="1530" y1="1367" x2="810" y2="-793"/>
      <line x1="1566" y1="1349" x2="846" y2="-811"/>
    </g>

    <!-- fundamental parallelogram spanned by a1 and a2 -->
    <polygon points="810,467 846,449 828,395 792,413" fill="#A78BFA" fill-opacity="0.13" stroke="none"/>

    <!-- decomposition guides: 4a1 and 5a2 -->
    <g stroke="#E5E7EB" stroke-width="2" stroke-opacity="0.68" stroke-dasharray="7 6" fill="none">
      <line x1="810" y1="467" x2="954" y2="395"/>
      <line x1="954" y1="395" x2="864" y2="125"/>
      <line x1="810" y1="467" x2="720" y2="197"/>
      <line x1="720" y1="197" x2="864" y2="125"/>
    </g>

    <!-- images of the basis vectors -->
    <line x1="810" y1="467" x2="846" y2="449" stroke="#A78BFA" stroke-width="3" marker-end="url(#arrowAccent)"/>
    <line x1="810" y1="467" x2="792" y2="413" stroke="#A78BFA" stroke-width="3" marker-end="url(#arrowAccent)"/>

    <!-- T(4,5) = (3,19) -->
    <line x1="810" y1="467" x2="864" y2="125" stroke="#E5E7EB" stroke-width="3" marker-end="url(#arrowInk)"/>

    <!-- origin dot -->
    <circle cx="810" cy="467" r="3" fill="#E5E7EB"/>

    <!-- labels -->
    <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" paint-order="stroke" stroke="#131312" stroke-width="4" stroke-linejoin="round">
      <text x="864" y="108" text-anchor="middle" fill="#E5E7EB">T(4,5) = (3,19)</text>
      <text x="856" y="464" text-anchor="start" fill="#C4B5FD">a₁ = T(e₁)</text>
      <text x="784" y="424" text-anchor="end" fill="#C4B5FD">a₂ = T(e₂)</text>
      <text x="966" y="411" text-anchor="start" fill="#9CA3AF">4a₁</text>
      <text x="710" y="205" text-anchor="end" fill="#9CA3AF">5a₂</text>
    </g>
  </g>

  <!-- caption -->
  <text x="620" y="574" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="15" fill="#9CA3AF">两列 a₁ = T(e₁)、a₂ = T(e₂) 决定整张网格；T(4,5) = 4a₁ + 5a₂。</text>
</svg>
