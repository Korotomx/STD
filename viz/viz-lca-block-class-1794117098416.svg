    <text x="1058" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">2</text>
    <text x="1130" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">1</text>
    <text x="1202" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">2</text>
    <text x="1022" y="230" text-anchor="middle" font-size="18" fill="#A78BFA">+</text>
    <text x="1094" y="230" text-anchor="middle" font-size="18" fill="#A78BFA">−</text>
