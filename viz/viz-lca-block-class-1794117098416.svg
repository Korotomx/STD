<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920"
     font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-variant-numeric="tabular-nums">
  <defs>
    <marker id="arw-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
    <marker id="arw-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22D3EE"/>
    </marker>
    <marker id="arw-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse"
