    <rect x="647" y="418" width="44" height="44" rx="4" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="701" y="418" width="44" height="44" rx="4" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="755" y="418" width="44" height="44" rx="4" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="809" y="418" width="44" height="44" rx="4" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5"/>
