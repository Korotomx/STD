  <text x="762" y="324" text-anchor="start" font-size="19" fill="#9CA3AF">−4</text>
  <text x="1094" y="324" text-anchor="middle" font-size="19" fill="#9CA3AF">−1</text>

  <!-- ============ canonical class box ============ -->
  <g>
    <rect x="560" y="350" width="380" height="128" rx="12" fill="#A78BFA" fill-opacity="0.06" stroke="#A78BFA" stroke-width="1.6"/>
