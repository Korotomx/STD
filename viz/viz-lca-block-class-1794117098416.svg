    <rect x="136" y="656" width="62" height="52"/>
    <rect x="136" y="708" width="62" height="52"/>
    <rect x="198" y="708" width="62" height="52"/>
    <rect x="136" y="760" width="62" height="52"/>
    <rect x="198" y="760" width="62" height="52"/>
    <rect x="260" y="760" width="62" height="52"/>
  </g>

  <!-- highlight i=1, j=2 -->
  <rect x="260" y="656" width="62" height="52" rx="3" fill="#A78BFA" fill-opacity="0.24" stroke="#A78BFA" stroke-width="2.5"/>

  <!-- upper-triangle values -->
  <g text-anchor="middle" font-size="22" fill="#E5E7EB">
    <text x="167" y="637">0</text>
    <text x="229" y="637">0</text>
    <text x="291" y="637">0</text>
    <text x="353" y="637">0</text>
    <text x="229" y="689">1</text>
