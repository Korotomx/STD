    <text x="642" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">4</text>
    <text x="714" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">5</text>
    <text x="786" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">4</text>
    <text x="858" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">5</text>
    <text x="678" y="230" text-anchor="middle" font-size="18" fill="#A78BFA">+</text>
    <text x="750" y="230" text-anchor="middle" font-size="18" fill="#A78BFA">−</text>
    <text x="822" y="230" text-anchor="middle" font-size="18" fill="#A78BFA">+</text>
    <text x="642" y="278" text-anchor="middle" font-size="16" fill="#9CA3AF">4</text>
    <text x="714" y="278" text-anchor="middle" font-size="16" fill="#9CA3AF">5</text>
    <text x="786" y="278" text-anchor="middle" font-size="16" fill="#9CA3AF">6</text>
    <text x="858" y="278" text-anchor="middle" font-size="16" fill="#9CA3AF">7</text>
  </g>

