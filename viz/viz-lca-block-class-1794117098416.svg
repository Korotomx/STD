  <rect x="0" y="0" width="1500" height="920" fill="#0B0B0F"/>

  <text x="750" y="60" text-anchor="middle" font-size="40" font-weight="650" fill="#E5E7EB">±1 block classes: same shape, shared table</text>
  <text x="750" y="98" text-anchor="middle" font-size="22" fill="#9CA3AF">Subtract the base depth; only the sign string remains</text>

