  </g>
  <text x="291" y="689" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text>

  <!-- query chip -->
  <rect x="92" y="834" width="292" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.025" stroke="#2E2E2E" stroke-width="1.2"/>
  <text x="238" y="861" text-anchor="middle" font-size="19"><tspan fill="#9CA3AF">query [1..2]</tspan><tspan fill="#22D3EE" dx="6">→</tspan><tspan fill="#E5E7EB" dx="6">local 2</tspan></text>

  <text x="424" y="862" font-size="16" fill="#9CA3AF">rows = start i · cols = end j</text>

  <!-- ============ bottom right: mapping back ============ -->
  <!-- wire from highlighted cell to fan origin -->
  <path d="M322,656 H460" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.9"/>
  <circle cx="322" cy="656" r="3.5" fill="#22D3EE"/>

  <g stroke="#22D3EE" stroke-width="2" fill="none">
    <path d="M460,656 L620,580" marker-end="url(#arw-cyan)"/>
    <path d="M460,656 H620" marker-end="url(#arw-cyan)"/>
    <path d="M460,656 L620,740" marker-end="url(#arw-cyan)"/>
  </g>

  <g>
