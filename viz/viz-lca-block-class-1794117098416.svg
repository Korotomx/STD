    <text x="755" y="587" text-anchor="middle" font-size="20"><tspan fill="#E5E7EB" font-weight="600">block X</tspan><tspan fill="#22D3EE" dx="6">→</tspan><tspan fill="#9CA3AF" dx="6">index 2</tspan></text>
  </g>
  <g>
    <rect x="620" y="636" width="270" height="48" rx="10" fill="#FFFFFF" fill-opacity="0.025" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="755" y="667" text-anchor="middle" font-size="20"><tspan fill="#E5E7EB" font-weight="600">block Y</tspan><tspan fill="#22D3EE" dx="6">→</tspan><tspan fill="#9CA3AF" dx="6">index 6</tspan></text>
  </g>
  <g>
    <rect x="620" y="716" width="270" height="48" rx="10" fill="#FFFFFF" fill-opacity="0.025" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="755" y="747" text-anchor="middle" font-size="20"><tspan fill="#E5E7EB" font-weight="600">block Z</tspan><tspan fill="#22D3EE" dx="6">→</tspan><tspan fill="#9CA3AF" dx="6">index 10</tspan></text>
  </g>

  <text x="620" y="786" font-size="19" fill="#9CA3AF">same local answer, different absolute position</text>

  <!-- ============ inset: the other class ============ -->
  <rect x="980" y="806" width="470" height="82" rx="10" fill="#FFFFFF" fill-opacity="0.02" stroke="#2E2E2E" stroke-width="1.2"/>
  <text x="1000" y="840" font-size="19" fill="#E5E7EB">block W [3,2,1]</text>
  <text x="1000" y="864" font-size="16" fill="#9CA3AF">signs −,−</text>
  <path d="M1176,848 H1242" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arw-amber)"/>
  <text x="1260" y="840" font-size="19" font-weight="600" fill="#F59E0B">class (−,−)</text>
  <text x="1260" y="864" font-size="16" fill="#9CA3AF">different table</text>

</svg>
