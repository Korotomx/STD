    <rect x="198" y="604" width="62" height="52"/>
    <rect x="260" y="604" width="62" height="52"/>
    <rect x="322" y="604" width="62" height="52"/>
    <rect x="198" y="656" width="62" height="52"/>
    <rect x="260" y="656" width="62" height="52"/>
    <rect x="322" y="656" width="62" height="52"/>
    <rect x="260" y="708" width="62" height="52"/>
    <rect x="322" y="708" width="62" height="52"/>
    <rect x="322" y="760" width="62" height="52"/>
  </g>
