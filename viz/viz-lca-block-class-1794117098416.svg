    <rect x="938" y="150" width="312" height="152" rx="12" fill="#FFFFFF" fill-opacity="0.025" stroke="#2E2E2E" stroke-width="1.5"/>
    <text x="958" y="182" font-size="21"><tspan fill="#E5E7EB" font-weight="600">block Z</tspan><tspan fill="#9CA3AF"> · base 1</tspan></text>
    <rect x="958" y="196" width="56" height="56" rx="5" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="1030" y="196" width="56" height="56" rx="5" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5"/>
