    <text x="270" y="182" font-size="21"><tspan fill="#E5E7EB" font-weight="600">block X</tspan><tspan fill="#9CA3AF"> · base 2</tspan></text>
    <rect x="270" y="196" width="56" height="56" rx="5" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="342" y="196" width="56" height="56" rx="5" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="414" y="196" width="56" height="56" rx="5" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="486" y="196" width="56" height="56" rx="5" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="298" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">2</text>
    <text x="370" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">3</text>
    <text x="442" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">2</text>
    <text x="514" y="235" text-anchor="middle" font-size="30" font-weight="600" fill="#E5E7EB">3</text>
    <text x="334" y="230" text-anchor="middle" font-size="18" fill="#A78BFA">+</text>
    <text x="406" y="230" text-anchor="middle" font-size="18" fill="#A78BFA">−</text>
    <text x="478" y="230" text-anchor="middle" font-size="18" fill="#A78BFA">+</text>
    <text x="298" y="278" text-anchor="middle" font-size="16" fill="#9CA3AF">0</text>
    <text x="370" y="278" text-anchor="middle" font-size="16" fill="#9CA3AF">1</text>
    <text x="442" y="278" text-anchor="middle" font-size="16" fill="#9CA3AF">2</text>
    <text x="514" y="278" text-anchor="middle" font-size="16" fill="#9CA3AF">3</text>
  </g>

  <!-- ============ Block Y ============ -->
  <g>
    <rect x="594" y="150" width="312" height="152" rx="12" fill="#FFFFFF" fill-opacity="0.025" stroke="#2E2E2E" stroke-width="1.5"/>
    <text x="614" y="182" font-size="21"><tspan fill="#E5E7EB" font-weight="600">block Y</tspan><tspan fill="#9CA3AF"> · base 4</tspan></text>
    <rect x="614" y="196" width="56" height="56" rx="5" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="686" y="196" width="56" height="56" rx="5" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="758" y="196" width="56" height="56" rx="5" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.5"/>
