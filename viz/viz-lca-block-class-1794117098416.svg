    <text x="723" y="449" text-anchor="middle" font-size="24" font-weight="600" fill="#E5E7EB">1</text>
    <text x="777" y="449" text-anchor="middle" font-size="24" font-weight="600" fill="#E5E7EB">0</text>
    <text x="831" y="449" text-anchor="middle" font-size="24" font-weight="600" fill="#E5E7EB">1</text>
  </g>

  <!-- ============ bottom left: shared table ============ -->
  <text x="92" y="540" font-size="24" font-weight="600" fill="#E5E7EB">shared table: interval → local argmin</text>
  <rect x="72" y="556" width="336" height="336" rx="12" fill="#FFFFFF" fill-opacity="0.02" stroke="#2E2E2E" stroke-width="1.5"/>

  <!-- table header -->
  <rect x="92" y="566" width="44" height="38" fill="#FFFFFF" fill-opacity="0.03" stroke="#2E2E2E" stroke-width="1"/>
  <text x="114" y="590" text-anchor="middle" font-size="15" fill="#9CA3AF">i \ j</text>
  <rect x="136" y="566" width="62" height="38" fill="#FFFFFF" fill-opacity="0.03" stroke="#2E2E2E" stroke-width="1"/>
  <rect x="198" y="566" width="62" height="38" fill="#FFFFFF" fill-opacity="0.03" stroke="#2E2E2E" stroke-width="1"/>
  <rect x="260" y="566" width="62" height="38" fill="#FFFFFF" fill-opacity="0.03" stroke="#2E2E2E" stroke-width="1"/>
  <rect x="322" y="566" width="62" height="38" fill="#FFFFFF" fill-opacity="0.03" stroke="#2E2E2E" stroke-width="1"/>
  <text x="167" y="590" text-anchor="middle" font-size="18" fill="#9CA3AF">0</text>
  <text x="229" y="590" text-anchor="middle" font-size="18" fill="#9CA3AF">1</text>
  <text x="291" y="590" text-anchor="middle" font-size="18" fill="#9CA3AF">2</text>
  <text x="353" y="590" text-anchor="middle" font-size="18" fill="#9CA3AF">3</text>

  <!-- row headers -->
  <rect x="92" y="604" width="44" height="52" fill="#FFFFFF" fill-opacity="0.03" stroke="#2E2E2E" stroke-width="1"/>
  <rect x="92" y="656" width="44" height="52" fill="#FFFFFF" fill-opacity="0.03" stroke="#2E2E2E" stroke-width="1"/>
  <rect x="92" y="708" width="44" height="52" fill="#FFFFFF" fill-opacity="0.03" stroke="#2E2E2E" stroke-width="1"/>
  <rect x="92" y="760" width="44" height="52" fill="#FFFFFF" fill-opacity="0.03" stroke="#2E2E2E" stroke-width="1"/>
  <text x="114" y="637" text-anchor="middle" font-size="18" fill="#9CA3AF">0</text>
  <text x="114" y="689" text-anchor="middle" font-size="18" fill="#9CA3AF">1</text>
  <text x="114" y="741" text-anchor="middle" font-size="18" fill="#9CA3AF">2</text>
  <text x="114" y="793" text-anchor="middle" font-size="18" fill="#9CA3AF">3</text>

  <!-- upper-triangle cells -->
  <g fill="#A78BFA" fill-opacity="0.07" stroke="#2E2E2E" stroke-width="1">
