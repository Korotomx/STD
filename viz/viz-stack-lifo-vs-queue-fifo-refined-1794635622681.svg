<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="520" viewBox="0 0 1140 520">
  <rect x="0" y="0" width="1140" height="520" fill="#131312"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E5E7EB"/>
    </marker>
  </defs>

  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">

    <!-- panel divider -->
    <line x1="500" y1="64" x2="500" y2="466" stroke="#2E2E2E" stroke-width="1" stroke-dasharray="6 6"/>

    <!-- ================= LEFT PANEL: STACK ================= -->
    <text x="250" y="84" text-anchor="middle" font-size="24" fill="#E5E7EB">栈 <tspan fill="#9CA3AF">·</tspan> <tspan fill="#A78BFA">LIFO</tspan></text>

    <!-- cells: bottom 1, middle 2, top 3 -->
    <rect x="175" y="350" width="150" height="80" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <rect x="175" y="260" width="150" height="80" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <rect x="175" y="170" width="150" height="80" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>

    <text x="250" y="401" text-anchor="middle" font-size="30" fill="#E5E7EB">1</text>
    <text x="250" y="311" text-anchor="middle" font-size="30" fill="#E5E7EB">2</text>
    <text x="250" y="221" text-anchor="middle" font-size="30" fill="#E5E7EB">3</text>

    <!-- top marker on the right of the top cell -->
    <text x="338" y="214" text-anchor="start" font-size="20" fill="#9CA3AF">top</text>

    <!-- push: down into the top -->
    <text x="208" y="148" text-anchor="end" font-size="20" fill="#E5E7EB">push</text>
    <line x1="222" y1="112" x2="222" y2="170" stroke="#E5E7EB" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- pop: up out of the top -->
    <text x="292" y="148" text-anchor="start" font-size="20" fill="#E5E7EB">pop</text>
    <line x1="278" y1="170" x2="278" y2="112" stroke="#E5E7EB" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- ================= RIGHT PANEL: QUEUE ================= -->
    <text x="820" y="84" text-anchor="middle" font-size="24" fill="#E5E7EB">队列 <tspan fill="#9CA3AF">·</tspan> <tspan fill="#A78BFA">FIFO</tspan></text>

    <!-- cells: front (left) to back (right) -->
    <rect x="645" y="260" width="110" height="80" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <rect x="765" y="260" width="110" height="80" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <rect x="885" y="260" width="110" height="80" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>

    <text x="700" y="311" text-anchor="middle" font-size="30" fill="#E5E7EB">1</text>
    <text x="820" y="311" text-anchor="middle" font-size="30" fill="#E5E7EB">2</text>
    <text x="940" y="311" text-anchor="middle" font-size="30" fill="#E5E7EB">3</text>

    <!-- dequeue: out of the front (left) -->
    <text x="636" y="274" text-anchor="end" font-size="20" fill="#E5E7EB">dequeue</text>
    <line x1="642" y1="300" x2="555" y2="300" stroke="#E5E7EB" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- enqueue: into the back (from the right) -->
    <text x="1004" y="274" text-anchor="start" font-size="20" fill="#E5E7EB">enqueue</text>
    <line x1="1085" y1="300" x2="998" y2="300" stroke="#E5E7EB" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- front / back labels -->
    <line x1="645" y1="344" x2="645" y2="358" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="645" y="384" text-anchor="middle" font-size="20" fill="#9CA3AF">front</text>

    <line x1="995" y1="344" x2="995" y2="358" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="995" y="384" text-anchor="middle" font-size="20" fill="#9CA3AF">back</text>

  </g>
</svg>
