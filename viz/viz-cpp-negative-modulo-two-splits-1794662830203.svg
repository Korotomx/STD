<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="arOrange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34D399"/>
    </marker>
    <marker id="arPurple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E5484D"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#131312"/>

  <!-- title -->
  <text x="800" y="88" text-anchor="middle" font-size="52" font-weight="700" fill="#E5E7EB">同一个 -7，两种拆法</text>

  <!-- upper annotation -->
  <text x="800" y="190" text-anchor="middle" font-size="30" fill="#E5E7EB"><tspan fill="#F59E0B" font-weight="700">数学带余除法</tspan>：-7 = 3×(-3) + 2</text>
  <text x="800" y="237" text-anchor="middle" font-size="30" fill="#E5E7EB">余数 <tspan fill="#34D399" font-weight="700">2</tspan> ∈ [0,3)</text>

  <!-- number line -->
  <line x1="180" y1="480" x2="1440" y2="480" stroke="#E5E7EB" stroke-width="2.5"/>
  <g stroke="#9CA3AF" stroke-width="2">
    <line x1="300" y1="464" x2="300" y2="496"/>
    <line x1="600" y1="464" x2="600" y2="496"/>
    <line x1="900" y1="464" x2="900" y2="496"/>
    <line x1="1200" y1="464" x2="1200" y2="496"/>
  </g>
  <g font-size="30" fill="#9CA3AF" text-anchor="middle">
    <text x="300" y="540">-9</text>
    <text x="600" y="540">-6</text>
    <text x="900" y="540">-3</text>
    <text x="1200" y="540" fill="#E5E7EB">0</text>
  </g>
  <circle cx="500" cy="480" r="9" fill="#E5484D" stroke="#131312" stroke-width="2"/>
  <text x="500" y="540" text-anchor="middle" font-size="30" font-weight="700" fill="#E5484D">-7</text>

  <!-- path connectors between consecutive legs -->
  <g stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="300" y1="335" x2="300" y2="405"/>
    <line x1="600" y1="585" x2="600" y2="655"/>
  </g>

  <!-- upper path: 0 -> -9 -> -7 -->
  <line x1="1200" y1="335" x2="300" y2="335" stroke="#F59E0B" stroke-width="3" marker-end="url(#arOrange)"/>
  <g stroke="#F59E0B" stroke-width="2" opacity="0.75">
    <line x1="900" y1="328" x2="900" y2="342"/>
    <line x1="600" y1="328" x2="600" y2="342"/>
  </g>
  <line x1="300" y1="405" x2="500" y2="405" stroke="#34D399" stroke-width="3" marker-end="url(#arGreen)"/>
  <line x1="400" y1="398" x2="400" y2="412" stroke="#34D399" stroke-width="2" opacity="0.75"/>

  <!-- lower path: 0 -> -6 -> -7 -->
  <line x1="1200" y1="585" x2="600" y2="585" stroke="#A78BFA" stroke-width="3" marker-end="url(#arPurple)"/>
  <line x1="900" y1="578" x2="900" y2="592" stroke="#A78BFA" stroke-width="2" opacity="0.75"/>
  <line x1="600" y1="655" x2="500" y2="655" stroke="#E5484D" stroke-width="3" marker-end="url(#arRed)"/>

  <!-- lower annotation -->
  <text x="800" y="730" text-anchor="middle" font-size="30" fill="#E5E7EB"><tspan fill="#A78BFA" font-weight="700">C++ 向零截断</tspan>：-7 = 3×(-2) + (-1)</text>
  <text x="800" y="777" text-anchor="middle" font-size="30" fill="#E5E7EB">余数 <tspan fill="#E5484D" font-weight="700">-1</tspan> 落在 0 的左边</text>

  <!-- bottom identity -->
  <text x="800" y="850" text-anchor="middle" font-size="28" fill="#9CA3AF">恒等式 <tspan fill="#E5E7EB">(a/b)*b + a%b == a</tspan> 两边都成立；要欧几里得余数：<tspan fill="#34D399" font-weight="700">r = ((a%b)+b)%b</tspan></text>
</svg>
