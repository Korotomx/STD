    <text x="396" y="580" fill="#9CA3AF" text-anchor="end">左子树</text>
    <text x="450" y="580" fill="#A78BFA" text-anchor="middle">＜ 根 ＜</text>
    <text x="504" y="580" fill="#9CA3AF" text-anchor="start">右子树</text>
