    <circle cx="150" cy="450" r="38" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="150" y="450">1</text>

    <circle cx="370" cy="450" r="38" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="370" y="450">6</text>

    <circle cx="750" cy="450" r="38" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
