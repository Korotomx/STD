<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <rect width="900" height="640" fill="#131312"/>

  <g stroke="#9CA3AF" stroke-width="2.5" fill="none">
    <line x1="450" y1="150" x2="260" y2="300"/>
    <line x1="450" y1="150" x2="640" y2="300"/>
    <line x1="260" y1="300" x2="150" y2="450"/>
    <line x1="260" y1="300" x2="370" y2="450"/>
    <line x1="640" y1="300" x2="750" y2="450"/>
  </g>

  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="30" font-weight="500"
