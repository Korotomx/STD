    <circle cx="450" cy="150" r="38" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="450" y="150">8</text>

    <circle cx="260" cy="300" r="38" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
