<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700">
  <defs>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5EEAD4"/>
    </marker>
  </defs>

  <rect width="1040" height="700" fill="#131312"/>

  <!-- keys -->
  <rect x="60" y="100" width="150" height="58" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="135" y="129" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="26" fill="#E5E7EB">apple</text>

  <rect x="60" y="225" width="150" height="58" rx="10" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="135" y="254" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="26" fill="#E5E7EB">apply</text>

  <!-- apple path: solid purple into the hash function -->
  <line x1="210" y1="129" x2="300" y2="160" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <!-- apply path: dashed teal into the hash function -->
  <line x1="210" y1="254" x2="300" y2="222" stroke="#5EEAD4" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrowTeal)"/>

  <!-- hash function -->
  <rect x="300" y="130" width="230" height="120" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="415" y="190" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="26" fill="#E5E7EB">h(key) mod m</text>

  <!-- both hash outputs converge on bucket 3 -->
  <line x1="530" y1="185" x2="665" y2="385" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <line x1="530" y1="215" x2="665" y2="410" stroke="#5EEAD4" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrowTeal)"/>

  <!-- collision tag -->
  <text x="730" y="345" text-anchor="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">冲突</text>

  <!-- bucket slots -->
  <rect x="495" y="370" width="130" height="100" rx="8" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="560" y="420" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" fill="#9CA3AF">2</text>

  <rect x="665" y="370" width="130" height="100" rx="8" fill="#1E1E2E" stroke="#A78BFA" stroke-width="3.5"/>
  <text x="730" y="420" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" fill="#E5E7EB">3</text>

  <rect x="835" y="370" width="130" height="100" rx="8" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="900" y="420" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" fill="#9CA3AF">4</text>

  <!-- chain hanging from bucket 3 -->
  <line x1="730" y1="470" x2="730" y2="500" stroke="#A78BFA" stroke-width="2.5"/>

  <rect x="635" y="500" width="190" height="50" rx="8" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <line x1="755" y1="500" x2="755" y2="550" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="695" y="525" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">apple</text>
  <text x="790" y="525" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">1</text>

  <line x1="730" y1="550" x2="730" y2="576" stroke="#A78BFA" stroke-width="2.5"/>

  <rect x="635" y="576" width="190" height="50" rx="8" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <line x1="755" y1="576" x2="755" y2="626" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="695" y="601" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">apply</text>
  <text x="790" y="601" text-anchor="middle" dominant-baseline="middle"
        font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="22" fill="#E5E7EB">2</text>
</svg>
