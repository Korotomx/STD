<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#131312"/>

  <!-- 标题 -->
  <text x="80" y="78" font-size="46" font-weight="600" fill="#E5E7EB">ISA 是契约，微架构是实现</text>

  <!-- 顶部：程序 / 编译器 -->
  <rect x="350" y="112" width="500" height="90" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="600" y="150" text-anchor="middle" font-size="32" fill="#E5E7EB">程序 / 编译器</text>
  <text x="600" y="184" text-anchor="middle" font-size="24" fill="#9CA3AF">编译目标 = 某套 ISA</text>

  <!-- 编译向下箭头 -->
  <line x1="600" y1="204" x2="600" y2="244" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ISA 契约带 -->
  <rect x="80" y="250" width="1040" height="200" rx="14" fill="#1E1E2E" stroke="#34D399" stroke-width="3"/>
  <text x="112" y="298" font-size="34" font-weight="600" fill="#34D399">ISA 契约</text>
  <text x="1088" y="296" font-size="24" fill="#34D399" text-anchor="end">软件看到的只有这一层</text>
  <line x1="110" y1="316" x2="1090" y2="316" stroke="#2E2E2E" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 三条款 -->
  <text x="120" y="376" font-size="30" fill="#34D399">①</text>
  <text x="160" y="376" font-size="28" fill="#E5E7EB">有哪些指令</text>

  <text x="440" y="376" font-size="30" fill="#34D399">②</text>
  <text x="480" y="376" font-size="28" fill="#E5E7EB">每条指令的二进制编码</text>

  <text x="844" y="376" font-size="30" fill="#34D399">③</text>
  <text x="884" y="376" font-size="28" fill="#E5E7EB">每条指令的行为</text>
  <text x="884" y="414" font-size="28" fill="#E5E7EB">（程序员可见）</text>

  <line x1="408" y1="340" x2="408" y2="430" stroke="#2E2E2E" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="812" y1="340" x2="812" y2="430" stroke="#2E2E2E" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 三个微架构向上箭头 -->
  <line x1="240" y1="560" x2="240" y2="458" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="600" y1="560" x2="600" y2="458" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="960" y1="560" x2="960" y2="458" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="420" y="514" text-anchor="middle" font-size="26" fill="#34D399">实现同一套契约</text>

  <!-- 厂商 A：3 级流水线，小缓存 -->
  <rect x="80" y="566" width="320" height="210" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.2"/>
  <text x="98" y="602" font-size="28" fill="#E5E7EB">厂商 A 的实现</text>
  <rect x="140" y="628" width="56" height="44" rx="4" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="212" y="628" width="56" height="44" rx="4" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="284" y="628" width="56" height="44" rx="4" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="98" y="696" width="60" height="14" rx="4" fill="#F59E0B" opacity="0.85"/>
  <text x="98" y="748" font-size="26" fill="#9CA3AF">3 级流水线 · L1 32 KB</text>

  <!-- 厂商 B：5 级流水线，中缓存 -->
  <rect x="440" y="566" width="320" height="210" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.2"/>
  <text x="458" y="602" font-size="28" fill="#E5E7EB">厂商 B 的实现</text>
  <rect x="481" y="628" width="38" height="44" rx="4" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="531" y="628" width="38" height="44" rx="4" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="581" y="628" width="38" height="44" rx="4" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="631" y="628" width="38" height="44" rx="4" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="681" y="628" width="38" height="44" rx="4" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="458" y="696" width="140" height="14" rx="4" fill="#F59E0B" opacity="0.85"/>
  <text x="458" y="748" font-size="26" fill="#9CA3AF">5 级流水线 · L1 256 KB</text>

  <!-- 厂商 C：7 级流水线，大缓存 -->
  <rect x="800" y="566" width="320" height="210" rx="12" fill="#1E1E2E" stroke="#A78BFA" stroke-width="2.2"/>
  <text x="818" y="602" font-size="28" fill="#E5E7EB">厂商 C 的实现</text>
  <rect x="852" y="628" width="24" height="44" rx="3" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="884" y="628" width="24" height="44" rx="3" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="916" y="628" width="24" height="44" rx="3" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="948" y="628" width="24" height="44" rx="3" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="980" y="628" width="24" height="44" rx="3" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="1012" y="628" width="24" height="44" rx="3" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="1044" y="628" width="24" height="44" rx="3" fill="#131312" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="818" y="696" width="230" height="14" rx="4" fill="#F59E0B" opacity="0.85"/>
  <text x="818" y="748" font-size="26" fill="#9CA3AF">7 级流水线 · L1 512 KB</text>

  <!-- 右侧竖排结论 -->
  <rect x="1190" y="170" width="360" height="540" rx="16" fill="#1E1E2E" stroke="#6B7280" stroke-width="1.5"/>
  <text x="1300" y="240" font-size="32" fill="#E5E7EB" writing-mode="tb">同一份机器码 → 三个都能跑</text>
  <text x="1450" y="240" font-size="32" fill="#E5E7EB" writing-mode="tb">换一套 ISA → 必须重新编译</text>

  <!-- 底部注释 -->
  <text x="80" y="846" font-size="26" fill="#9CA3AF">架构一词的歧义：说「不同架构」可能指<tspan fill="#E5484D">不同 ISA（不兼容）</tspan>，也可能指<tspan fill="#34D399">不同微架构（兼容）</tspan></text>
</svg>
