<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <defs>
    <clipPath id="plot"><rect x="75" y="109" width="850" height="476"/></clipPath>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9CA3AF"/>
    </marker>
    <marker id="vecArrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E5E7EB"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#131312"/>

  <!-- grid -->
  <g stroke="#2E2E2E" stroke-width="1" stroke-dasharray="4 7">
    <line x1="160" y1="109" x2="160" y2="585"/>
    <line x1="245" y1="109" x2="245" y2="585"/>
    <line x1="415" y1="109" x2="415" y2="585"/>
    <line x1="500" y1="109" x2="500" y2="585"/>
    <line x1="585" y1="109" x2="585" y2="585"/>
    <line x1="670" y1="109" x2="670" y2="585"/>
    <line x1="755" y1="109" x2="755" y2="585"/>
    <line x1="840" y1="109" x2="840" y2="585"/>
    <line x1="75" y1="160" x2="925" y2="160"/>
    <line x1="75" y1="245" x2="925" y2="245"/>
    <line x1="75" y1="330" x2="925" y2="330"/>
    <line x1="75" y1="415" x2="925" y2="415"/>
  </g>

  <!-- level lines 2x+y=c -->
  <g clip-path="url(#plot)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="-100" x2="630" y2="1100"/>
    <line x1="72.5" y1="-100" x2="672.5" y2="1100"/>
    <line x1="115" y1="-100" x2="715" y2="1100"/>
    <line x1="200" y1="-100" x2="800" y2="1100"/>
  </g>
  <line x1="157.5" y1="-100" x2="757.5" y2="1100" clip-path="url(#plot)" stroke="#C4B5FD" stroke-width="3.5" stroke-linecap="round"/>

  <!-- axes -->
  <g fill="none" stroke="#9CA3AF" stroke-width="1.6">
    <line x1="75" y1="500" x2="925" y2="500" marker-end="url(#axisArrow)"/>
    <line x1="330" y1="585" x2="330" y2="109" marker-end="url(#axisArrow)"/>
  </g>
  <text x="938" y="508" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-style="italic" fill="#9CA3AF">x</text>
  <text x="344" y="130" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="21" font-style="italic" fill="#9CA3AF">y</text>

  <!-- vectors -->
  <line x1="330" y1="500" x2="408" y2="422" stroke="#E5E7EB" stroke-width="3" marker-end="url(#vecArrow)"/>
  <line x1="330" y1="500" x2="330" y2="256" stroke="#E5E7EB" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#vecArrow)"/>
  <circle cx="415" cy="415" r="5.5" fill="#E5E7EB"/>
  <circle cx="330" cy="245" r="5.5" fill="#E5E7EB"/>

  <!-- vector leaders + labels -->
  <g stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 4">
    <line x1="425" y1="411" x2="458" y2="403"/>
    <line x1="337" y1="241" x2="396" y2="222"/>
  </g>
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" fill="#E5E7EB">
    <text x="466" y="406">v=(1,1), f(v)=3</text>
    <text x="402" y="222">u=(0,3), f(u)=3</text>
  </g>

  <!-- level labels -->
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" text-anchor="middle">
    <text x="134.5" y="97" fill="#9CA3AF">c=0</text>
    <text x="177" y="97" fill="#9CA3AF">c=1</text>
    <text x="219.5" y="97" fill="#9CA3AF">c=2</text>
    <text x="262" y="97" fill="#C4B5FD">c=3</text>
    <text x="304.5" y="97" fill="#9CA3AF">c=4</text>
  </g>

  <!-- text block -->
  <g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="19" fill="#E5E7EB">
    <text x="620" y="205">f(x,y)=2x+y 是线性泛函：</text>
    <text x="620" y="237">输入向量，输出一个数。</text>
    <text x="620" y="289">等值线 f=c 是一组平行线；</text>
    <text x="620" y="321">f(v) 告诉你 v 落在哪条线上。</text>
  </g>
</svg>
