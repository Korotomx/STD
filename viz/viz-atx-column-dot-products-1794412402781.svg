<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif">
  <rect width="1200" height="650" fill="#131312"/>

  <defs>
    <marker id="arAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
    </marker>
    <marker id="arInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E5E7EB"/>
    </marker>
    <marker id="arLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C4B5FD"/>
    </marker>
    <marker id="arAxis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- ================= header data ================= -->
  <text x="600" y="42" text-anchor="middle" font-size="17" fill="#9CA3AF">A = [[2, 1], [0, 3]]，x = (1, 1)</text>

  <!-- ================= LEFT PANEL: W ================= -->
  <text x="95" y="82" font-size="23" font-weight="600" fill="#E5E7EB">W 平面</text>
  <text x="95" y="110" font-size="17" fill="#9CA3AF">x·y = y₁ + y₂ 的等值线</text>
  <text x="95" y="140" font-size="16" fill="#7D8590">同一条虚线上，x·y 的值不变</text>

  <!-- level lines c = 0,1,3 (de-emphasised) -->
  <g stroke="#4B5563" stroke-width="1.2" stroke-dasharray="5 7">
    <line x1="223.6" y1="453.6" x2="276.4" y2="506.4"/>
    <line x1="223.6" y1="387.6" x2="342.4" y2="506.4"/>
    <line x1="223.6" y1="255.6" x2="474.4" y2="506.4"/>
  </g>

  <!-- level lines through a1 (c=2) and a2 (c=4), highlighted -->
  <g stroke="#A78BFA" stroke-width="2" stroke-dasharray="8 5">
    <line x1="223.6" y1="321.6" x2="408.4" y2="506.4"/>
    <line x1="223.6" y1="189.6" x2="540.4" y2="506.4"/>
  </g>

  <!-- axes -->
  <g stroke="#9CA3AF" stroke-width="1.5" fill="none">
    <line x1="205" y1="480" x2="572" y2="480" marker-end="url(#arAxis)"/>
    <line x1="250" y1="496" x2="250" y2="158" marker-end="url(#arAxis)"/>
  </g>
  <text x="548" y="466" font-size="18" fill="#9CA3AF">y₁</text>
  <text x="262" y="176" font-size="18" fill="#9CA3AF">y₂</text>
  <circle cx="250" cy="480" r="3" fill="#E5E7EB"/>

  <!-- columns a1, a2 -->
  <g stroke="#E5E7EB" stroke-width="2.5" fill="none">
    <line x1="250" y1="480" x2="382" y2="480" marker-end="url(#arInk)"/>
    <line x1="250" y1="480" x2="316" y2="282" marker-end="url(#arInk)"/>
  </g>
  <text x="396" y="466" font-size="19" fill="#9CA3AF">a₁ = (2, 0)</text>
  <text x="332" y="252" font-size="19" fill="#9CA3AF">a₂ = (1, 3)</text>

  <!-- x vector -->
  <line x1="250" y1="480" x2="316" y2="414" stroke="#C4B5FD" stroke-width="3" marker-end="url(#arLight)"/>
  <text x="332" y="400" font-size="20" fill="#C4B5FD">x = (1, 1)</text>

  <!-- dot product labels at the two highlighted level lines -->
  <text x="208" y="328" text-anchor="end" font-size="20" fill="#A78BFA">x·a₁ = 2</text>
  <text x="208" y="196" text-anchor="end" font-size="20" fill="#A78BFA">x·a₂ = 4</text>


  <!-- divider -->
  <line x1="612" y1="140" x2="612" y2="540" stroke="#262626" stroke-width="1"/>

  <!-- ================= RIGHT PANEL: V ================= -->
  <text x="655" y="82" font-size="23" font-weight="600" fill="#E5E7EB">V 平面</text>
  <text x="655" y="110" font-size="17" fill="#9CA3AF">两个点积 → 两个坐标</text>

  <!-- coordinate guides -->
  <g stroke="#2E2E2E" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="894" y1="470" x2="894" y2="262"/>
    <line x1="790" y1="262" x2="894" y2="262"/>
  </g>

  <!-- axes -->
  <g stroke="#9CA3AF" stroke-width="1.5" fill="none">
    <line x1="700" y1="470" x2="1085" y2="470" marker-end="url(#arAxis)"/>
    <line x1="790" y1="470" x2="790" y2="155" marker-end="url(#arAxis)"/>
  </g>
  <text x="1090" y="464" font-size="18" fill="#9CA3AF">x₁</text>
  <text x="802" y="172" font-size="18" fill="#9CA3AF">x₂</text>
  <text x="770" y="492" font-size="17" fill="#9CA3AF">O</text>

  <!-- A^T x arrow + point -->
  <line x1="790" y1="470" x2="888" y2="274" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#arAccent)"/>
  <circle cx="894" cy="262" r="7" fill="#A78BFA"/>

  <text x="912" y="236" font-size="22" fill="#E5E7EB">Aᵀx = (2, 4)</text>
  <text x="912" y="304" font-size="17" fill="#9CA3AF">坐标 = (x·a₁, x·a₂)</text>

  <!-- the two measurements become the two coordinates -->
  <text x="894" y="505" text-anchor="middle" font-size="20" fill="#A78BFA">x·a₁ = 2</text>
  <text x="770" y="268" text-anchor="end" font-size="20" fill="#A78BFA">x·a₂ = 4</text>

  <!-- ================= caption ================= -->
  <text x="600" y="604" text-anchor="middle" font-size="20" fill="#E5E7EB">Aᵀx 不是一个神秘的箭头：它的第 i 个坐标就是 x 与 A 的第 i 列的点积。</text>
</svg>
